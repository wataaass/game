<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LANTERNFALL — 灯火の底</title>
<meta name="description" content="灯りで闇を払う見下ろしアクションローグライク。絵も音も地形もすべてコードで生成。">
<style>
  html, body { margin: 0; height: 100%; background: #050409; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #0b0a12; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; image-rendering: pixelated; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #fatal { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 2em; text-align: center;
    color: #f3ead8; font: 16px/1.8 system-ui, sans-serif; white-space: pre-wrap; }
</style>
<style>
/* LANTERNFALL — DOM UI。依存なし、すべてシステムフォントと CSS で描く。 */
#ui {
  --ui-bg: #0b0a12;
  --ui-panel: #15131f;
  --ui-border: #2c2740;
  --ui-text: #f3ead8;
  --ui-dim: #9a8f84;
  --ui-ember: #ffb347;
  --ui-flame: #ff7a2f;
  --ui-gold: #ffe9b0;
  --ui-blue: #6fa8ff;
  --ui-red: #ff4d5e;
  --ui-green: #7ee0a1;
  --ui-violet: #c59bff;
  --ui-font: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  position: absolute;
  inset: 0;
  z-index: 10;
  overflow: hidden;
  pointer-events: none;
  color: var(--ui-text);
  font-family: var(--ui-font);
  font-size: 14px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
}

#ui *,
#ui *::before,
#ui *::after {
  box-sizing: border-box;
}

#ui [hidden] {
  display: none !important;
}

#ui button,
#ui input {
  font-family: inherit;
}

#ui button {
  color: inherit;
}

#ui button:focus-visible,
#ui input:focus-visible {
  outline: 2px solid var(--ui-gold);
  outline-offset: 2px;
}

#ui ::-webkit-scrollbar {
  width: 8px;
}

#ui ::-webkit-scrollbar-track {
  background: rgba(11, 10, 18, 0.6);
}

#ui ::-webkit-scrollbar-thumb {
  background: #3a3350;
  border-radius: 2px;
}

/* ---------------------------------------------------------------- HUD */
.ui-hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.92);
  transition: opacity 0.2s ease, visibility 0.2s;
}

.ui-hud.ui-is-off {
  opacity: 0;
  visibility: hidden;
}

.ui-hud-block {
  background: rgba(21, 19, 31, 0.55);
  border: 1px solid rgba(44, 39, 64, 0.78);
  border-radius: 2px;
  box-shadow: inset 0 1px 0 rgba(255, 233, 176, 0.06);
}

.ui-tl {
  position: absolute;
  top: clamp(10px, 1.4vh, 20px);
  left: clamp(10px, 1.3vw, 24px);
  width: clamp(184px, 20vw, 288px);
  padding: clamp(7px, 0.7vw, 11px) clamp(8px, 0.9vw, 13px);
}

.ui-hearts {
  display: flex;
  align-items: center;
  gap: clamp(2px, 0.28vw, 4px);
  min-height: clamp(16px, 1.7vw, 23px);
}

.ui-heart {
  position: relative;
  display: block;
  width: clamp(16px, 1.7vw, 23px);
  height: clamp(16px, 1.7vw, 23px);
  flex: 0 0 auto;
}

.ui-heart-svg {
  display: block;
  width: 100%;
  height: 100%;
}

.ui-heart-empty path {
  fill: #3a2733;
  stroke: #241c2a;
  stroke-width: 0.6;
}

.ui-heart-fill {
  position: absolute;
  inset: 0;
}

.ui-heart-fill path {
  fill: #ff7a2f;
  filter: drop-shadow(0 0 3px rgba(255, 122, 47, 0.42));
}

.ui-heart.half .ui-heart-fill {
  clip-path: inset(0 50% 0 0);
}

.ui-heart.empty .ui-heart-fill {
  display: none;
}

.ui-oil {
  margin-top: clamp(5px, 0.6vw, 8px);
}

.ui-meter-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 2px;
  font-size: clamp(9px, 0.72vw, 11px);
  letter-spacing: 0.12em;
  color: var(--ui-dim);
}

.ui-meter-value {
  color: var(--ui-gold);
  font-variant-numeric: tabular-nums;
}

.ui-bar {
  position: relative;
  height: clamp(7px, 0.62vw, 10px);
  overflow: hidden;
  background: rgba(11, 10, 18, 0.88);
  border: 1px solid var(--ui-border);
  border-radius: 2px;
}

.ui-bar-fill {
  width: 0;
  height: 100%;
  transition: width 0.12s linear;
}

.ui-oil-fill {
  background: linear-gradient(90deg, #ff7a2f, #ffb347 70%, #ffe9b0);
  box-shadow: 0 0 8px rgba(255, 122, 47, 0.38);
}

.ui-oil.is-danger .ui-oil-fill {
  background: linear-gradient(90deg, #b32231, var(--ui-red));
  box-shadow: 0 0 10px rgba(255, 77, 94, 0.55);
  animation: ui-danger-pulse 1s ease-in-out infinite;
}

.ui-oil.is-danger .ui-oil-track {
  border-color: rgba(255, 77, 94, 0.72);
}

.ui-oil.is-danger .ui-meter-value {
  color: var(--ui-red);
}

.ui-xp {
  display: flex;
  align-items: center;
  gap: clamp(5px, 0.55vw, 8px);
  margin-top: clamp(4px, 0.5vw, 7px);
}

.ui-xp-lv {
  flex: 0 0 auto;
  font-size: clamp(9px, 0.7vw, 11px);
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--ui-gold);
  font-variant-numeric: tabular-nums;
}

.ui-xp-track {
  flex: 1 1 auto;
  height: clamp(3px, 0.3vw, 5px);
  border-radius: 1px;
}

.ui-xp-fill {
  background: linear-gradient(90deg, #9a6a2f, var(--ui-ember));
  box-shadow: 0 0 6px rgba(255, 179, 71, 0.32);
}

.ui-boss {
  position: absolute;
  top: clamp(10px, 1.6vh, 22px);
  left: 50%;
  width: clamp(240px, 34vw, 560px);
  transform: translateX(-50%);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0.25s;
}

.ui-boss.show {
  opacity: 1;
  visibility: visible;
}

.ui-boss-name {
  margin-bottom: 3px;
  text-align: center;
  font-size: clamp(11px, 1vw, 15px);
  font-weight: 700;
  letter-spacing: 0.3em;
  padding-left: 0.3em;
  color: var(--ui-gold);
  text-shadow: 0 0 12px rgba(255, 122, 47, 0.42), 0 1px 3px #000;
}

.ui-boss-track {
  height: clamp(8px, 0.8vw, 13px);
  overflow: hidden;
  background: rgba(11, 10, 18, 0.86);
  border: 1px solid rgba(255, 77, 94, 0.45);
  border-radius: 2px;
  box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.8);
}

.ui-boss-fill {
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, #b32231, var(--ui-red) 55%, #ff7a2f);
  box-shadow: 0 0 12px rgba(255, 77, 94, 0.48);
  transition: width 0.14s linear;
}

.ui-tr {
  position: absolute;
  top: clamp(10px, 1.4vh, 20px);
  right: clamp(10px, 1.3vw, 24px);
  min-width: clamp(102px, 10vw, 150px);
  padding: clamp(6px, 0.6vw, 10px) clamp(8px, 0.9vw, 13px);
  text-align: right;
}

.ui-depth {
  font-size: clamp(11px, 0.92vw, 14px);
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--ui-gold);
}

.ui-score {
  font-size: clamp(18px, 1.7vw, 26px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: 0.06em;
  color: var(--ui-text);
  font-variant-numeric: tabular-nums;
}

.ui-time {
  font-size: clamp(10px, 0.82vw, 13px);
  color: var(--ui-dim);
  font-variant-numeric: tabular-nums;
}

.ui-tags {
  display: flex;
  justify-content: flex-end;
  gap: 4px;
  margin-top: 3px;
}

.ui-tag {
  padding: 0 4px;
  border: 1px solid rgba(255, 179, 71, 0.6);
  border-radius: 1px;
  font-size: clamp(8px, 0.62vw, 10px);
  font-weight: 700;
  letter-spacing: 0.16em;
  line-height: 1.5;
  color: var(--ui-ember);
  background: rgba(255, 179, 71, 0.08);
}

.ui-tag-replay {
  border-color: rgba(111, 168, 255, 0.65);
  color: var(--ui-blue);
  background: rgba(111, 168, 255, 0.09);
}

.ui-bl {
  position: absolute;
  bottom: clamp(10px, 1.5vh, 22px);
  left: clamp(10px, 1.3vw, 24px);
}

.ui-dash {
  display: flex;
  align-items: center;
  gap: clamp(5px, 0.6vw, 9px);
  padding: clamp(4px, 0.4vw, 7px) clamp(6px, 0.7vw, 10px);
  background: rgba(21, 19, 31, 0.55);
  border: 1px solid rgba(44, 39, 64, 0.78);
  border-radius: 2px;
}

.ui-dash-ring {
  position: relative;
  width: clamp(26px, 2.6vw, 36px);
  height: clamp(26px, 2.6vw, 36px);
  border-radius: 50%;
  background: conic-gradient(var(--ui-gold) var(--ui-dash-angle, 0deg), rgba(44, 39, 64, 0.9) 0);
  box-shadow: 0 0 0 1px rgba(11, 10, 18, 0.8);
}

.ui-dash-ring::after {
  content: "";
  position: absolute;
  inset: clamp(3px, 0.32vw, 5px);
  border-radius: 50%;
  background: rgba(11, 10, 18, 0.94);
}

.ui-dash.ready .ui-dash-ring {
  background: conic-gradient(var(--ui-gold) 360deg, rgba(44, 39, 64, 0.9) 0);
  box-shadow: 0 0 12px rgba(255, 179, 71, 0.55);
}

.ui-dash-label {
  font-size: clamp(9px, 0.72vw, 11px);
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--ui-dim);
}

.ui-dash.ready .ui-dash-label {
  color: var(--ui-gold);
}

.ui-bc {
  position: absolute;
  bottom: clamp(10px, 1.5vh, 22px);
  left: 50%;
  width: min(56vw, 760px);
  transform: translateX(-50%);
}

.ui-chips {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 3px 4px;
  max-height: calc(2.3em + 10px);
  overflow: hidden;
}

.ui-chip,
.ui-owned-chip {
  display: inline-block;
  padding: 0 5px;
  border: 1px solid rgba(255, 179, 71, 0.45);
  border-radius: 2px;
  background: rgba(21, 19, 31, 0.82);
  color: #e7d9c4;
  font-size: clamp(9px, 0.7vw, 11px);
  line-height: 1.55;
  white-space: nowrap;
}

.ui-chip.ui-rarity-2,
.ui-owned-chip.ui-rarity-2 {
  border-color: rgba(111, 168, 255, 0.6);
  color: #cfe2ff;
}

.ui-chip.ui-rarity-3,
.ui-owned-chip.ui-rarity-3 {
  border-color: rgba(197, 155, 255, 0.7);
  color: #eadcff;
  box-shadow: 0 0 7px rgba(197, 155, 255, 0.18);
}

.ui-br {
  position: absolute;
  right: clamp(10px, 1.3vw, 24px);
  bottom: clamp(10px, 1.5vh, 22px);
}

.ui-minimap {
  padding: 4px;
  background: rgba(21, 19, 31, 0.7);
  border: 1px solid var(--ui-border);
  border-radius: 3px;
  box-shadow: inset 0 1px 0 rgba(255, 233, 176, 0.05), 0 6px 20px rgba(0, 0, 0, 0.35);
}

.ui-minimap-canvas {
  display: block;
  width: 168px;
  height: 120px;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* ---------------------------------------------------------------- パネル共通 */
.ui-panel {
  position: relative;
  background: rgba(21, 19, 31, 0.88);
  border: 1px solid var(--ui-border);
  border-radius: 3px;
  box-shadow:
    inset 0 1px 0 rgba(255, 233, 176, 0.08),
    inset 0 18px 30px -26px rgba(255, 179, 71, 0.7),
    0 14px 54px rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(2px);
}

.ui-overlay {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(8px, 2vw, 32px);
  background: radial-gradient(ellipse at 50% 42%, rgba(32, 20, 15, 0.35), rgba(5, 4, 10, 0.68));
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.18s ease, visibility 0.18s;
}

.ui-overlay.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.ui-overlay.open .ui-panel {
  animation: ui-panel-in 0.22s ease both;
}

.ui-btn {
  appearance: none;
  padding: clamp(7px, 0.8vw, 11px) clamp(12px, 1.5vw, 22px);
  border: 1px solid var(--ui-ember);
  border-radius: 2px;
  background: rgba(11, 10, 18, 0.42);
  color: var(--ui-gold);
  font-size: clamp(12px, 0.95vw, 15px);
  font-weight: 700;
  letter-spacing: 0.06em;
  line-height: 1.3;
  white-space: nowrap;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
}

.ui-btn:hover {
  background: var(--ui-flame);
  color: #170d08;
  box-shadow: 0 0 18px rgba(255, 122, 47, 0.38);
}

.ui-btn:active {
  transform: translateY(1px);
}

.ui-btn-primary {
  background: rgba(255, 122, 47, 0.14);
}

.ui-btn-small {
  padding: 2px 8px;
  font-size: clamp(9px, 0.72vw, 11px);
  font-weight: 600;
}

.ui-btn-continue {
  border-color: var(--ui-gold);
  color: var(--ui-gold);
}

.ui-panel-heading,
.ui-end-heading,
.ui-upgrade-heading {
  margin: 0;
  text-align: center;
  font-size: clamp(20px, 2.2vw, 32px);
  font-weight: 800;
  letter-spacing: 0.14em;
  color: var(--ui-gold);
  text-shadow: 0 0 20px rgba(255, 122, 47, 0.32), 0 2px 8px rgba(0, 0, 0, 0.8);
}

.ui-menu-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: clamp(6px, 0.9vw, 12px);
}

.ui-box-title {
  margin-bottom: 5px;
  font-size: clamp(9px, 0.72vw, 11px);
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--ui-dim);
}

/* ---------------------------------------------------------------- タイトル */
.ui-title-overlay {
  background:
    radial-gradient(ellipse at 50% 36%, rgba(70, 38, 22, 0.34), transparent 62%),
    rgba(5, 4, 10, 0.79);
}

.ui-title-panel {
  width: min(92vw, 900px);
  max-height: calc(100vh - clamp(12px, 3vh, 40px));
  padding: clamp(16px, 2.4vw, 36px) clamp(18px, 3.2vw, 52px);
  overflow-y: auto;
  text-align: center;
}

.ui-title-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.ui-logo {
  max-width: 100%;
  font-size: clamp(2.35rem, 6.2vw, 5.1rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.13em;
  padding-left: 0.13em;
  white-space: nowrap;
  color: transparent;
  background: linear-gradient(180deg, #ffe9b0 0%, #ffb347 48%, #ff7a2f 100%);
  -webkit-background-clip: text;
  background-clip: text;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.6));
  animation: ui-logo-flicker 5s ease-in-out infinite;
}

.ui-subtitle {
  margin-top: clamp(3px, 0.5vw, 7px);
  font-size: clamp(12px, 1.2vw, 17px);
  font-weight: 700;
  letter-spacing: 0.5em;
  padding-left: 0.5em;
  color: var(--ui-ember);
}

.ui-premise {
  margin: clamp(6px, 0.9vw, 12px) 0 0;
  font-size: clamp(11px, 0.9vw, 14px);
  letter-spacing: 0.05em;
  color: var(--ui-dim);
}

.ui-best {
  margin-top: clamp(6px, 0.8vw, 10px);
  font-size: clamp(10px, 0.82vw, 13px);
  letter-spacing: 0.08em;
  color: var(--ui-gold);
}

.ui-title-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: clamp(6px, 0.9vw, 12px);
  margin-top: clamp(12px, 1.8vw, 22px);
}

.ui-title-actions .ui-btn {
  min-width: clamp(124px, 14vw, 190px);
}

.ui-btn-replay {
  border-color: var(--ui-blue);
  color: #cfe2ff;
}

.ui-btn-replay:hover {
  background: var(--ui-blue);
  color: #08101f;
  box-shadow: 0 0 18px rgba(111, 168, 255, 0.38);
}

.ui-seed-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: min(100%, 460px);
  margin-top: clamp(9px, 1.1vw, 14px);
  font-size: clamp(10px, 0.8vw, 12px);
  color: var(--ui-dim);
}

.ui-seed-label {
  flex: 0 0 auto;
  letter-spacing: 0.1em;
}

.ui-seed-input {
  flex: 1 1 auto;
  min-width: 0;
  padding: clamp(5px, 0.55vw, 8px) 9px;
  border: 1px solid var(--ui-border);
  border-radius: 2px;
  background: rgba(11, 10, 18, 0.82);
  color: var(--ui-text);
  font-size: clamp(11px, 0.85vw, 13px);
  letter-spacing: 0.04em;
}

.ui-seed-input::placeholder {
  color: #6f6470;
}

.ui-seed-input:focus {
  border-color: var(--ui-ember);
}

.ui-seed-input:focus:not(:focus-visible) {
  outline: none;
}

.ui-title-meta {
  display: grid;
  grid-template-columns: minmax(0, 1.12fr) minmax(0, 0.88fr);
  gap: clamp(8px, 1.4vw, 16px);
  width: 100%;
  margin-top: clamp(12px, 1.8vw, 22px);
  text-align: left;
}

.ui-title-box {
  padding: clamp(8px, 1vw, 13px) clamp(9px, 1.1vw, 14px);
  background: rgba(11, 10, 18, 0.34);
  border: 1px solid rgba(44, 39, 64, 0.82);
  border-radius: 2px;
}

.ui-legend {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px 10px;
}

.ui-legend-item {
  font-size: clamp(9px, 0.72vw, 11px);
  line-height: 1.65;
  color: var(--ui-dim);
  white-space: nowrap;
}

.ui-options {
  display: flex;
  flex-direction: column;
  gap: clamp(3px, 0.4vw, 6px);
}

.ui-opt {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(56px, 1.2fr) auto;
  align-items: center;
  gap: 7px;
  font-size: clamp(9px, 0.72vw, 11px);
  color: var(--ui-dim);
}

.ui-opt-label {
  white-space: nowrap;
}

.ui-opt-value {
  min-width: 30px;
  text-align: right;
  color: var(--ui-gold);
  font-variant-numeric: tabular-nums;
}

.ui-opt-check {
  grid-template-columns: minmax(0, 1fr) auto;
  margin-top: 2px;
}

.ui-range {
  width: 100%;
  height: 16px;
  margin: 0;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  cursor: pointer;
}

.ui-range::-webkit-slider-runnable-track {
  height: 4px;
  background: #2c2740;
  border-radius: 2px;
}

.ui-range::-webkit-slider-thumb {
  width: 12px;
  height: 12px;
  margin-top: -4px;
  border: none;
  border-radius: 50%;
  background: var(--ui-ember);
  box-shadow: 0 0 8px rgba(255, 179, 71, 0.52);
  -webkit-appearance: none;
}

.ui-range::-moz-range-track {
  height: 4px;
  background: #2c2740;
  border-radius: 2px;
}

.ui-range::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border: none;
  border-radius: 50%;
  background: var(--ui-ember);
  box-shadow: 0 0 8px rgba(255, 179, 71, 0.52);
}

.ui-check {
  width: 14px;
  height: 14px;
  margin: 0;
  accent-color: var(--ui-ember);
  cursor: pointer;
}

.ui-version {
  margin-top: clamp(8px, 1vw, 12px);
  font-size: clamp(8px, 0.62vw, 10px);
  letter-spacing: 0.16em;
  color: #6f6470;
}

/* ---------------------------------------------------------------- 強化選択 */
.ui-upgrade-overlay {
  background: radial-gradient(ellipse at 50% 45%, rgba(52, 31, 18, 0.4), rgba(5, 4, 10, 0.78));
}

.ui-upgrade-panel {
  width: min(94vw, 1080px);
  max-height: calc(100vh - clamp(12px, 3vh, 40px));
  padding: clamp(14px, 2vw, 28px);
  overflow-y: auto;
  text-align: center;
}

.ui-upgrade-heading {
  margin-bottom: clamp(12px, 1.6vw, 20px);

<script>
(() => {
'use strict';
// ---- src/core/rng.js
// 種から同じ乱数列を必ず再現する PRNG（sfc32）。Math.random はシミュレーションで使わない。
function hashString(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
  return h >>> 0;
}

function mix32(a, b) {
  let z = (Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x7f4a7c15, 0xc2b2ae35)) | 0;
  z = Math.imul(z ^ (z >>> 15), 0x2c1b3c6d);
  z = Math.imul(z ^ (z >>> 12), 0x297a2d39);
  return (z ^ (z >>> 15)) >>> 0;
}

class RNG {
  constructor(seed) {
    let s = seed >>> 0;
    const sm = () => {
      s = (s + 0x9e3779b9) | 0;
      let z = s;
      z = Math.imul(z ^ (z >>> 16), 0x85ebca6b);
      z = Math.imul(z ^ (z >>> 13), 0xc2b2ae35);
      return (z ^ (z >>> 16)) >>> 0;
    };
    this.a = sm(); this.b = sm(); this.c = sm(); this.d = 1;
    for (let i = 0; i < 12; i++) this.u32();
  }
  u32() {
    const t = (((this.a + this.b) | 0) + this.d) | 0;
    this.d = (this.d + 1) | 0;
    this.a = this.b ^ (this.b >>> 9);
    this.b = (this.c + (this.c << 3)) | 0;
    this.c = (this.c << 21) | (this.c >>> 11);
    this.c = (this.c + t) | 0;
    return t >>> 0;
  }
  f() { return this.u32() / 4294967296; }
  range(a, b) { return a + (b - a) * this.f(); }
  int(n) { return (this.f() * n) | 0; }
  irange(a, b) { return a + this.int(b - a + 1); }
  chance(p) { return this.f() < p; }
  pick(arr) { return arr[this.int(arr.length)]; }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = this.int(i + 1);
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  // 重み付き抽選。weights の合計が 0 なら -1。
  weighted(weights) {
    let sum = 0;
    for (const w of weights) sum += w;
    if (sum <= 0) return -1;
    let r = this.f() * sum;
    for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r < 0) return i; }
    return weights.length - 1;
  }
  state() { return [this.a, this.b, this.c, this.d]; }
}

// ---- src/sim/dungeon.js
// ダンジョン生成。種と階層から同じ地形を必ず再現する。
// 手順: 部屋を間隔つきで配置 → 最小全域木＋少数のループで接続 → A* で幅2の通路を掘る
//       → 部屋の内部を変形 → 扉から中心までの通り道を保証 → 到達できない床を埋める。


const T_VOID = 0, T_FLOOR = 1, T_WALL = 2, T_DOOR = 3;
const MAP_W = 84, MAP_H = 60;
const ROOM_GAP = 5; // 部屋どうしの間に幅2の通路が必ず通る間隔

class MinHeap {
  constructor() { this.k = []; this.v = []; }
  get size() { return this.k.length; }
  push(key, val) {
    const k = this.k, v = this.v;
    let i = k.length; k.push(key); v.push(val);
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (k[p] <= key) break;
      k[i] = k[p]; v[i] = v[p]; i = p;
    }
    k[i] = key; v[i] = val;
  }
  pop() {
    const k = this.k, v = this.v, top = v[0];
    const lk = k.pop(), lv = v.pop(), n = k.length;
    if (n > 0) {
      let i = 0;
      for (;;) {
        let c = i * 2 + 1;
        if (c >= n) break;
        if (c + 1 < n && k[c + 1] < k[c]) c++;
        if (k[c] >= lk) break;
        k[i] = k[c]; v[i] = v[c]; i = c;
      }
      k[i] = lk; v[i] = lv;
    }
    return top;
  }
}

const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];

function tooClose(a, b, m) {
  return a.x - m < b.x + b.w && a.x + a.w + m > b.x && a.y - m < b.y + b.h && a.y + a.h + m > b.y;
}

function generateDungeon(seed, depth) {
  for (let attempt = 0; attempt < 64; attempt++) {
    const d = tryGenerate(mix32(mix32(seed >>> 0, depth), attempt), depth);
    if (d) { d.seed = seed >>> 0; d.depth = depth; return d; }
  }
  throw new Error('dungeon generation failed');
}

function tryGenerate(s, depth) {
  const W = MAP_W, H = MAP_H, rng = new RNG(s);
  const boss = depth % 5 === 0;
  const rooms = [];
  const place = (w, h, tries) => {
    for (let i = 0; i < tries; i++) {
      const r = { x: rng.irange(5, W - w - 6), y: rng.irange(5, H - h - 6), w, h };
      if (rooms.every(o => !tooClose(r, o, ROOM_GAP))) { rooms.push(r); return r; }
    }
    return null;
  };
  if (boss) {
    place(7, 7, 300); place(25, 17, 600); place(9, 7, 600);
    if (rooms.length < 3) return null;
  } else {
    const want = Math.min(8 + depth, 12);
    place(7, 7, 100);
    for (let i = 0; i < 500 && rooms.length < want; i++) place(rng.irange(9, 15), rng.irange(7, 11), 1);
    if (rooms.length < 6) return null;
  }
  rooms.forEach((r, i) => {
    r.id = i; r.cx = r.x + (r.w >> 1); r.cy = r.y + (r.h >> 1);
    r.links = []; r.doors = []; r.torches = []; r.props = []; r.state = 'idle'; r.role = 'combat';
  });

  // --- 接続グラフ: Prim 法の最小全域木に、近い部屋どうしのループを少し足す
  const n = rooms.length;
  const dist2 = (a, b) => (a.cx - b.cx) ** 2 + (a.cy - b.cy) ** 2;
  const edges = [], inTree = new Array(n).fill(false);
  inTree[0] = true;
  for (let c = 1; c < n; c++) {
    let best = Infinity, bi = -1, bj = -1;
    for (let i = 0; i < n; i++) if (inTree[i]) for (let j = 0; j < n; j++) if (!inTree[j]) {
      const d = dist2(rooms[i], rooms[j]);
      if (d < best) { best = d; bi = i; bj = j; }
    }
    inTree[bj] = true; edges.push([bi, bj]);
  }
  const linked = (i, j) => edges.some(e => (e[0] === i && e[1] === j) || (e[0] === j && e[1] === i));
  if (!boss) {
    let extra = 0;
    for (let i = 0; i < n && extra < 3; i++) for (let j = i + 1; j < n && extra < 3; j++) {
      if (!linked(i, j) && dist2(rooms[i], rooms[j]) < 24 * 24 && rng.chance(0.22)) { edges.push([i, j]); extra++; }
    }
  }
  for (const [i, j] of edges) { rooms[i].links.push(j); rooms[j].links.push(i); }

  // --- 通路: 幅2のブラシ（左上基準の2x2）が通れないセルを先に求める
  const tiles = new Uint8Array(W * H);
  const blocked = new Uint8Array(W * H);

    if (x < 1 || y < 1 || x > W - 3 || y > H - 3) { blocked[y * W + x] = 1; continue; }
    for (const r of rooms) {
      if (x + 1 >= r.x - 1 && x <= r.x + r.w && y + 1 >= r.y - 1 && y <= r.y + r.h) { blocked[y * W + x] = 1; break; }
    }
  }
  const carved = new Uint8Array(W * H);
  const makeDoor = (r, o) => {
    const dx = o.cx - r.cx, dy = o.cy - r.cy;
    if (Math.abs(dx) * r.h > Math.abs(dy) * r.w) {
      const py = rng.irange(r.y + 1, r.y + r.h - 3);
      return dx > 0
        ? { cells: [[r.x + r.w, py], [r.x + r.w, py + 1]], start: [r.x + r.w + 1, py], inner: [r.x + r.w - 1, py], horiz: true }
        : { cells: [[r.x - 1, py], [r.x - 1, py + 1]], start: [r.x - 3, py], inner: [r.x, py], horiz: true };
    }
    const px = rng.irange(r.x + 1, r.x + r.w - 3);
    return dy > 0
      ? { cells: [[px, r.y + r.h], [px + 1, r.y + r.h]], start: [px, r.y + r.h + 1], inner: [px, r.y + r.h - 1], horiz: false }
      : { cells: [[px, r.y - 1], [px + 1, r.y - 1]], start: [px, r.y - 3], inner: [px, r.y], horiz: false };
  };
  const brush = (x, y) => {
    for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) { tiles[(y + j) * W + x + i] = T_FLOOR; carved[(y + j) * W + x + i] = 1; }
  };
  const lanes = [];
  for (const [i, j] of edges) {
    const da = makeDoor(rooms[i], rooms[j]), db = makeDoor(rooms[j], rooms[i]);
    const path = route(da.start, db.start, blocked, carved, W, H);
    if (!path) return null;
    for (const c of path) brush(c % W, (c / W) | 0);
    for (const [d, r] of [[da, rooms[i]], [db, rooms[j]]]) {
      for (const [x, y] of d.cells) r.doors.push({ x, y });
      lanes.push({ r, d });
    }
  }

  // --- 部屋の内部
  const solidIn = new Uint8Array(W * H); // 部屋の中に置く柱や岩
  for (const r of rooms) {
    for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) tiles[y * W + x] = T_FLOOR;
  }
  // 役割: 開始部屋から最も遠い部屋が出口。行き止まりは宝部屋。
  const gd = graphDist(rooms, 0);
  rooms.forEach((r, i) => { r.dist = gd[i]; });
  if (boss) {
    rooms[0].role = 'start'; rooms[1].role = 'boss'; rooms[2].role = 'treasure';
  } else {
    rooms[0].role = 'start';
    let exit = 1;
    for (let i = 1; i < n; i++) {
      if (gd[i] > gd[exit] || (gd[i] === gd[exit] && dist2(rooms[i], rooms[0]) > dist2(rooms[exit], rooms[0]))) exit = i;
    }
    rooms[exit].role = 'exit';
    let treasures = 0;
    for (let i = 1; i < n && treasures < 2; i++) {
      if (i !== exit && rooms[i].links.length === 1) { rooms[i].role = 'treasure'; treasures++; }
    }
    const combat = rooms.filter(r => r.role === 'combat');
    if (treasures === 0 && combat.length > 4) { rng.pick(combat).role = 'treasure'; }
    const rest = rooms.filter(r => r.role === 'combat');
    if (depth >= 2 && rest.length >= 4) rng.pick(rest).role = 'shrine';
  }
  for (const r of rooms) shapeRoom(r, rng, solidIn, W);
  // 扉から部屋の中心まで、幅2の通り道を必ず空ける
  const clear2 = (x, y) => { for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) solidIn[(y + j) * W + x + i] = 0; };
  for (const { r, d } of lanes) {
    let [x, y] = d.inner;
    const tx = Math.min(Math.max(r.cx - 1, r.x), r.x + r.w - 2), ty = Math.min(Math.max(r.cy - 1, r.y), r.y + r.h - 2);
    x = Math.min(x, r.x + r.w - 2); y = Math.min(y, r.y + r.h - 2);
    clear2(x, y);
    if (d.horiz) { while (x !== tx) { x += Math.sign(tx - x); clear2(x, y); } while (y !== ty) { y += Math.sign(ty - y); clear2(x, y); } }
    else { while (y !== ty) { y += Math.sign(ty - y); clear2(x, y); } while (x !== tx) { x += Math.sign(tx - x); clear2(x, y); } }
  }
  for (const r of rooms) {
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) solidIn[(r.cy + j) * W + r.cx + i] = 0;
  }
  for (let i = 0; i < W * H; i++) if (solidIn[i]) tiles[i] = T_VOID;
  for (const r of rooms) for (const d of r.doors) tiles[d.y * W + d.x] = T_DOOR;

  // --- 開始地点から届かない床を埋める
  const start = { x: rooms[0].cx + 0.5, y: rooms[0].cy + 0.5 };
  const reach = new Uint8Array(W * H), stack = [rooms[0].cy * W + rooms[0].cx];
  reach[stack[0]] = 1;
  while (stack.length) {
    const c = stack.pop(), cx = c % W, cy = (c / W) | 0;
    for (let k = 0; k < 4; k++) {
      const nx = cx + DX[k], ny = cy + DY[k], ni = ny * W + nx;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H || reach[ni] || tiles[ni] === T_VOID) continue;
      reach[ni] = 1; stack.push(ni);
    }
  }
  for (let i = 0; i < W * H; i++) if (tiles[i] !== T_VOID && !reach[i]) tiles[i] = T_VOID;
  for (const r of rooms) if (!reach[r.cy * W + r.cx]) return null;
  // 床に接する岩を壁にする
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (tiles[y * W + x] !== T_VOID) continue;
    let near = false;
    for (let j = -1; j <= 1 && !near; j++) for (let i = -1; i <= 1; i++) {
      const nx = x + i, ny = y + j;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const t = tiles[ny * W + nx];
      if (t === T_FLOOR || t === T_DOOR) { near = true; break; }
    }
    if (near) tiles[y * W + x] = T_WALL;
  }

  // --- 部屋番号の対応表、松明、壺
  const roomAt = new Int8Array(W * H).fill(-1);
  for (const r of rooms) for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) roomAt[y * W + x] = r.id;
  const torches = [];
  for (const r of rooms) {
    const cand = [];
    for (let y = r.y - 1; y <= r.y + r.h; y++) for (let x = r.x - 1; x <= r.x + r.w; x++) {
      if (tiles[y * W + x] !== T_WALL) continue;
      for (let k = 0; k < 4; k++) {
        const fx = x + DX[k], fy = y + DY[k];
        if (fx < r.x || fy < r.y || fx >= r.x + r.w || fy >= r.y + r.h || tiles[fy * W + fx] !== T_FLOOR) continue;
        if (r.doors.some(d => Math.abs(d.x - x) + Math.abs(d.y - y) < 3)) continue;
        cand.push({ x: x + 0.5 + DX[k] * 0.72, y: y + 0.5 + DY[k] * 0.72, wx: x, wy: y, nx: DX[k], ny: DY[k] });
        break;
      }
    }
    rng.shuffle(cand);
    const want = r.role === 'boss' ? 8 : r.w * r.h > 110 ? 5 : 4, minD = r.role === 'boss' ? 6 : 4.5;
    const got = [];
    for (const c of cand) {
      if (got.length >= want) break;
      if (got.every(g => Math.hypot(g.x - c.x, g.y - c.y) >= minD)) got.push(c);
    }
    for (const t of got) {
      t.room = r.id; t.lit = r.role === 'start'; t.k = 0;
      r.torches.push(torches.length); torches.push(t);
    }
    if (r.role === 'combat' || r.role === 'exit') {
      const count = rng.irange(0, 4);
      for (let i = 0, tries = 0; i < count && tries < 60; tries++) {
        const x = rng.irange(r.x, r.x + r.w - 1), y = rng.irange(r.y, r.y + r.h - 1);
        if (tiles[y * W + x] !== T_FLOOR) continue;
        let walls = 0;
        for (let k = 0; k < 4; k++) if (tiles[(y + DY[k]) * W + x + DX[k]] === T_WALL) walls++;
        if (walls === 0 || Math.abs(x - r.cx) + Math.abs(y - r.cy) < 3) continue;
        if (r.doors.some(d => Math.abs(d.x - x) + Math.abs(d.y - y) < 4)) continue;
        if (r.props.some(p => p.x === x + 0.5 && p.y === y + 0.5)) continue;
        r.props.push({ x: x + 0.5, y: y + 0.5 }); i++;
      }
    }
  }
  const exitRoom = rooms.find(r => r.role === 'exit' || r.role === 'boss');
  return {
    w: W, h: H, tiles, rooms, torches, roomAt, start, boss,
    stairs: { x: exitRoom.cx + 0.5, y: exitRoom.cy + 0.5, room: exitRoom.id, open: false },
    barred: new Uint8Array(W * H), solid: new Uint8Array(W * H), version: 0,
  };
}

function graphDist(rooms, from) {
  const d = new Array(rooms.length).fill(-1), q = [from];
  d[from] = 0;
  for (let h = 0; h < q.length; h++) for (const o of rooms[q[h]].links) if (d[o] < 0) { d[o] = d[q[h]] + 1; q.push(o); }
  return d;
}

// 幅2ブラシの A*。状態は（セル, 進行方向）。曲がり角にコストを足して、まっすぐな通路を好ませる。
function route(from, to, blocked, carved, W, H) {
  const N = W * H, g = new Float32Array(N * 4).fill(Infinity), prev = new Int32Array(N * 4).fill(-1);
  const heap = new MinHeap(), goal = to[1] * W + to[0], s0 = from[1] * W + from[0];
  if (blocked[s0] || blocked[goal]) return null;
  for (let d = 0; d < 4; d++) { g[s0 * 4 + d] = 0; heap.push(Math.abs(from[0] - to[0]) + Math.abs(from[1] - to[1]), s0 * 4 + d); }
  let end = -1;
  while (heap.size) {
    const st = heap.pop(), c = st >> 2, dir = st & 3;
    if (c === goal) { end = st; break; }
    const cx = c % W, cy = (c / W) | 0, gc = g[st];
    for (let k = 0; k < 4; k++) {
      if (((k + 2) & 3) === dir && gc > 0) continue;
      const nx = cx + DX[k], ny = cy + DY[k];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const ni = ny * W + nx;
      if (blocked[ni]) continue;
      const ng = gc + (carved[ni] ? 1 : 2) + (k !== dir && gc > 0 ? 4 : 0);
      if (ng < g[ni * 4 + k]) {
        g[ni * 4 + k] = ng; prev[ni * 4 + k] = st;
        heap.push(ng + Math.abs(nx - to[0]) + Math.abs(ny - to[1]), ni * 4 + k);
      }
    }
  }
  if (end < 0) return null;
  const path = [];
  for (let st = end; st >= 0; st = prev[st]) path.push(st >> 2);
  return path;
}

function shapeRoom(r, rng, solidIn, W) {
  const set = (x, y) => { if (x >= r.x && y >= r.y && x < r.x + r.w && y < r.y + r.h) solidIn[y * W + x] = 1; };
  let shape = 'rect';
  if (r.role === 'boss') shape = 'arena';
  else if (r.role === 'combat' || r.role === 'exit') shape = rng.pick(['rect', 'pillars', 'pillars', 'rounded', 'cave', 'islands', 'islands']);
  else if (r.role === 'treasure' || r.role === 'shrine') shape = 'rounded';
  r.shape = shape;
  const corner = (k) => {
    for (let j = 0; j < k; j++) for (let i = 0; i < k - j; i++) {
      set(r.x + i, r.y + j); set(r.x + r.w - 1 - i, r.y + j);
      set(r.x + i, r.y + r.h - 1 - j); set(r.x + r.w - 1 - i, r.y + r.h - 1 - j);
    }
  };
  if (shape === 'rounded') corner(2);
  else if (shape === 'arena') {
    corner(4);
    for (const [fx, fy] of [[0.25, 0.28], [0.75, 0.28], [0.25, 0.72], [0.75, 0.72]]) {
      const px = r.x + Math.round(r.w * fx) - 1, py = r.y + Math.round(r.h * fy) - 1;
      set(px, py); set(px + 1, py); set(px, py + 1); set(px + 1, py + 1);
    }
  } else if (shape === 'pillars') {
    const step = rng.pick([3, 4]);
    for (let y = r.y + 2; y < r.y + r.h - 2; y += step) for (let x = r.x + 2; x < r.x + r.w - 2; x += step) set(x, y);
  } else if (shape === 'islands') {
    const count = rng.irange(2, 4);
    for (let i = 0; i < count; i++) {
      const w = rng.irange(1, 3), h = rng.irange(1, 2), x = rng.irange(r.x + 2, r.x + r.w - 3 - w), y = rng.irange(r.y + 2, r.y + r.h - 3 - h);
      for (let j = 0; j < h; j++) for (let k = 0; k < w; k++) set(x + k, y + j);
    }
  } else if (shape === 'cave') {
    // 縁だけを乱数で埋め、セルオートマトンでなめらかにする
    const cell = new Uint8Array(r.w * r.h);
    for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) {
      const edge = Math.min(x, y, r.w - 1 - x, r.h - 1 - y);
      cell[y * r.w + x] = edge < 2 && rng.chance(edge === 0 ? 0.6 : 0.3) ? 1 : 0;
    }
    for (let it = 0; it < 2; it++) {
      const next = new Uint8Array(cell);
      for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) {
        let c = 0;
        for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
          if (!i && !j) continue;
          const nx = x + i, ny = y + j;
          c += nx < 0 || ny < 0 || nx >= r.w || ny >= r.h ? 1 : cell[ny * r.w + nx];
        }
        next[y * r.w + x] = c >= 5 ? 1 : c <= 2 ? 0 : cell[y * r.w + x];
      }
      cell.set(next);
    }
    for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) if (cell[y * r.w + x]) set(r.x + x, r.y + y);
  }
}
