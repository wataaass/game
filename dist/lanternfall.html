// ---- src/sim/util.js
// 地形への問い合わせと当たり判定。


const DT = 1 / 60;
const TAU = Math.PI * 2;

function rebuildSolid(m) {
  for (let i = 0; i < m.tiles.length; i++) {
    const t = m.tiles[i];
    m.solid[i] = t === T_FLOOR || (t === T_DOOR && !m.barred[i]) ? 0 : 1;
  }
  m.version++;
}

function solidAt(m, x, y) {
  if (x < 0 || y < 0 || x >= m.w || y >= m.h) return true;
  return m.solid[(y | 0) * m.w + (x | 0)] === 1;
}

// 2点の間に壁がないか（格子を1マスずつたどる DDA）。
function lineClear(m, x0, y0, x1, y1) {
  let tx = Math.floor(x0), ty = Math.floor(y0);
  const ex = Math.floor(x1), ey = Math.floor(y1);
  const dx = x1 - x0, dy = y1 - y0, sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1;
  const tdx = dx === 0 ? Infinity : Math.abs(1 / dx), tdy = dy === 0 ? Infinity : Math.abs(1 / dy);
  let tmx = dx === 0 ? Infinity : (dx > 0 ? tx + 1 - x0 : x0 - tx) * tdx;
  let tmy = dy === 0 ? Infinity : (dy > 0 ? ty + 1 - y0 : y0 - ty) * tdy;
  for (let i = 0; i < 400; i++) {
    if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h || m.solid[ty * m.w + tx]) return false;
    if (tx === ex && ty === ey) return true;
    if (tmx < tmy) { tmx += tdx; tx += sx; } else { tmy += tdy; ty += sy; }
  }
  return false;
}

function pushOut(m, e) {
  let any = false;
  const r = e.r;
  for (let it = 0; it < 3; it++) {
    let moved = false;
    const x0 = Math.floor(e.x - r), x1 = Math.floor(e.x + r), y0 = Math.floor(e.y - r), y1 = Math.floor(e.y + r);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      if (!(tx < 0 || ty < 0 || tx >= m.w || ty >= m.h || m.solid[ty * m.w + tx])) continue;
      const nx = Math.min(Math.max(e.x, tx), tx + 1), ny = Math.min(Math.max(e.y, ty), ty + 1);
      const ox = e.x - nx, oy = e.y - ny, d2 = ox * ox + oy * oy;
      if (d2 >= r * r) continue;
      if (d2 > 1e-10) {
        const d = Math.sqrt(d2), k = (r - d) / d;
        e.x += ox * k; e.y += oy * k;
      } else {
        const l = e.x - tx, rr = tx + 1 - e.x, t = e.y - ty, b = ty + 1 - e.y, mn = Math.min(l, rr, t, b);
        if (mn === l) e.x = tx - r; else if (mn === rr) e.x = tx + 1 + r; else if (mn === t) e.y = ty - r; else e.y = ty + 1 + r;
      }
      moved = true; any = true;
    }
    if (!moved) break;
  }
  return any;
}

// 円を動かして壁から押し出す。戻り値のビット: 1=横で衝突 2=縦で衝突
function moveCircle(m, e, dx, dy) {
  let hit = 0;
  const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 0.3));
  for (let i = 0; i < steps; i++) {
    e.x += dx / steps; if (pushOut(m, e)) hit |= 1;
    e.y += dy / steps; if (pushOut(m, e)) hit |= 2;
  }
  return hit;
}

// 目標タイルからの歩数（4方向の幅優先探索）。届かないマスは 65535。
function distanceField(m, tx, ty, out) {
  const W = m.w, d = out || new Uint16Array(W * m.h);
  d.fill(65535);
  if (solidAt(m, tx, ty)) return d;
  const q = distanceField.q && distanceField.q.length === d.length ? distanceField.q : (distanceField.q = new Int32Array(d.length));
  let head = 0, tail = 0;
  q[tail++] = ty * W + tx; d[ty * W + tx] = 0;
  while (head < tail) {
    const c = q[head++], nd = d[c] + 1;
    const cx = c % W;
    if (cx > 0 && !m.solid[c - 1] && d[c - 1] > nd) { d[c - 1] = nd; q[tail++] = c - 1; }
    if (cx < W - 1 && !m.solid[c + 1] && d[c + 1] > nd) { d[c + 1] = nd; q[tail++] = c + 1; }
    if (c >= W && !m.solid[c - W] && d[c - W] > nd) { d[c - W] = nd; q[tail++] = c - W; }
    if (c < d.length - W && !m.solid[c + W] && d[c + W] > nd) { d[c + W] = nd; q[tail++] = c + W; }
  }
  return d;
}

const NX = [1, -1, 0, 0, 1, 1, -1, -1], NY = [0, 0, 1, -1, 1, -1, 1, -1];
// 距離場を下る（sign=1）か上る（sign=-1）向きの、次に目指す点を返す。
function fieldStep(m, d, x, y, sign, out) {
  const tx = x | 0, ty = y | 0, W = m.w;
  let best = d[ty * W + tx], bx = tx, by = ty;
  if (best === 65535 && sign > 0) best = 65535;
  for (let k = 0; k < 8; k++) {
    const nx = tx + NX[k], ny = ty + NY[k];
    if (nx < 0 || ny < 0 || nx >= W || ny >= m.h || m.solid[ny * W + nx]) continue;
    if (k >= 4 && (m.solid[ty * W + nx] || m.solid[ny * W + tx])) continue; // 角をまたがない
    const v = d[ny * W + nx];
    if (v === 65535) continue;
    if (sign > 0 ? v < best : v > best) { best = v; bx = nx; by = ny; }
  }
  out.x = bx + 0.5; out.y = by + 0.5;
  return bx !== tx || by !== ty;
}

// ---- src/sim/combat.js
// 弾・敵の生成と、ダメージ処理。描画や音はここで出すイベントを見て動く。



function emit(G, type, x, y, a, b) { G.events.push({ type, x, y, a, b }); }

function lanternTarget(G) {
  const p = G.player;
  return (3.0 + 6.2 * Math.sqrt(Math.max(0, p.oil) / p.stats.oilMax)) * p.stats.lightMul;
}

// その地点の明るさ（松明＋ランタン）。0 が真っ暗。
function lightAt(G, x, y) {
  const m = G.map, p = G.player, R = G.lanternR;
  let l = G.staticLight[(y | 0) * m.w + (x | 0)] || 0;
  const d = Math.hypot(x - p.x, y - p.y);
  if (d < R && lineClear(m, p.x, p.y, x, y)) l += 1 - d / R;
  return l;
}

const TORCH_RADIUS = 6.5;
function rebuildStaticLight(G) {
  const m = G.map, L = G.staticLight, R = TORCH_RADIUS;
  L.fill(0);
  for (const t of m.torches) {
    if (!t.lit) continue;
    const x0 = Math.max(0, Math.floor(t.x - R)), x1 = Math.min(m.w - 1, Math.ceil(t.x + R));
    const y0 = Math.max(0, Math.floor(t.y - R)), y1 = Math.min(m.h - 1, Math.ceil(t.y + R));
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      const i = ty * m.w + tx;
      if (m.solid[i]) continue;
      const d = Math.hypot(tx + 0.5 - t.x, ty + 0.5 - t.y);
      if (d < R && lineClear(m, t.x, t.y, tx + 0.5, ty + 0.5)) L[i] += 1 - d / R;
    }
  }
  G.lightDirty = false; G.lightVersion++;
}

// --- 敵の空間ハッシュ（1マス2タイル）
function buildGrid(G) {
  const g = G.grid, es = G.enemies;
  g.head.fill(-1);
  if (g.next.length < es.length) g.next = new Int32Array(es.length * 2 + 64);
  for (let i = 0; i < es.length; i++) {
    const e = es[i];
    if (e.dead) continue;
    const c = ((e.y * 0.5) | 0) * g.cols + ((e.x * 0.5) | 0);
    g.next[i] = g.head[c]; g.head[c] = i;
  }
  g.count = es.length;
}

function forNear(G, x, y, r, fn) {
  const g = G.grid;
  const x0 = Math.max(0, ((x - r) * 0.5) | 0), x1 = Math.min(g.cols - 1, ((x + r) * 0.5) | 0);
  const y0 = Math.max(0, ((y - r) * 0.5) | 0), y1 = Math.min(g.rows - 1, ((y + r) * 0.5) | 0);
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
    for (let i = g.head[cy * g.cols + cx]; i >= 0; i = g.next[i]) fn(G.enemies[i]);
  }
}

function spawnEnemy(G, type, x, y, opts = {}) {
  const def = ENEMY[type], elite = !!opts.elite;
  const hp = Math.round(def.hp * (def.prop ? 1 : G.hpMul) * (elite ? 2.6 : 1));
  const e = {
    id: G.nextId++, type, x, y, vx: 0, vy: 0, kx: 0, ky: 0, r: def.r * (elite ? 1.25 : 1), hp, maxHp: hp,
    speed: def.speed * (elite ? 1.12 : 1), dmg: def.dmg, state: 'idle', t: 0, n: 0, pi: 0, phase: 1,
    cd: G.rng.range(0.6, 1.8), ang: G.rng.range(0, TAU), slot: G.rng.range(-1.9, 1.9), side: G.rng.chance(0.5) ? 1 : -1,
    flash: 0, burnT: 0, burnDps: 0, burnTick: 0, room: opts.room ?? -1, elite, spawnT: opts.delay ?? 0,
    los: false, lit: 1, orbCd: 0, dashTick: -1, stun: 0, invuln: 0, blocked: false, dead: false, face: 1,
  };
  G.enemies.push(e);
  return e;
}

function spawnBullet(G, o) {
  if (G.bullets.length >= 900) return null;
  const b = {
    team: 0, x: 0, y: 0, vx: 0, vy: 0, r: 0.14, dmg: 1, life: 1.2, pierce: 0, bounce: 0, split: 0, chain: 0,
    burn: 0, homing: 0, explode: 0, crit: false, hit: null, big: false, dead: false, age: 0,
  };
  Object.assign(b, o);
  G.bullets.push(b);
  return b;
}

function enemyBullet(G, x, y, ang, speed, r = 0.17) {
  return spawnBullet(G, { team: 1, x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, r, dmg: 1, life: 6 });
}

function bossResist(G, e) {
  const room = G.map.rooms[e.room];
  if (!room || !room.torches.length) return 1;
  let lit = 0;
  for (const ti of room.torches) if (G.map.torches[ti].lit) lit++;
  return 0.4 + 0.6 * (lit / room.torches.length);
}

function hurtEnemy(G, e, dmg, o = {}) {
  if (e.dead || e.spawnT > 0 || e.invuln > 0) return false;
  const p = G.player, def = ENEMY[e.type];
  if (def.boss) dmg *= bossResist(G, e);
  if (p.stats.radiance > 0 && o.src !== 'burn') {
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d < G.lanternR * 0.75 && lineClear(G.map, p.x, p.y, e.x, e.y)) dmg *= 1 + p.stats.radiance;
  }
  e.hp -= dmg; e.flash = 0.12; G.stats.dmg += dmg;
  if (o.kx !== undefined && def.speed > 0 && !def.boss && e.state !== 'dash') {
    const k = 0.42 / e.r; e.kx += o.kx * k; e.ky += o.ky * k;
  }
  emit(G, 'hit', e.x, e.y, dmg, o.crit ? 1 : o.src === 'burn' ? 2 : 0);
  if (e.hp <= 0) killEnemy(G, e);
  return true;
}

function killEnemy(G, e) {
  if (e.dead) return;
  e.dead = true;
  const p = G.player, def = ENEMY[e.type], rng = G.rng;
  emit(G, 'enemyDie', e.x, e.y, e.type, e.r);
  if (e.type === 'bomber') G.blasts.push({ x: e.x, y: e.y, r: 2.0, dmg: 45, team: 2 });
  if (e.burnT > 0 && p.stats.afterglow > 0) {
    G.blasts.push({ x: e.x, y: e.y, r: 1.4 + 0.4 * p.stats.afterglow, dmg: p.stats.dmg * 0.8, team: 0, burn: 1 });
  }
  const drop = (kind, v) => {
    const a = rng.range(0, TAU), s = rng.range(1.5, 4.5);
    G.pickups.push({ x: e.x, y: e.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, kind, v, age: 0 });
  };
  if (def.prop) {
    if (rng.chance(0.55)) drop('xp', 1);
    if (rng.chance(0.24)) drop('oil', 16);
    else if (rng.chance(0.07)) drop('heart', 1);
    return;
  }
  G.stats.kills++; G.score += 10 * def.xp * (e.elite ? 4 : 1);
  let xp = def.xp * (e.elite ? 4 : 1);
  while (xp > 0) { const v = xp >= 10 ? 5 : xp >= 4 ? 2 : 1; drop('xp', v); xp -= v; }
  if (rng.chance(e.elite || def.boss ? 1 : 0.11)) drop('oil', 18);
  if (rng.chance(e.elite ? 0.3 : def.boss ? 1 : 0.014)) drop('heart', def.boss ? 4 : 1);
  if (p.stats.vamp > 0 && p.hp < p.stats.maxHp && rng.chance(p.stats.vamp)) { p.hp++; emit(G, 'heal', p.x, p.y); }
  if (def.boss) {
    for (const b of G.bullets) if (b.team !== 0) b.dead = true;
    for (const o of G.enemies) if (!o.dead && o !== e && !ENEMY[o.type].prop) killEnemy(G, o);
    G.hitstop = 24;
    emit(G, 'bossDie', e.x, e.y);
  }
}

function hurtPlayer(G, dmg, sx, sy) {
  const p = G.player;
  if (p.inv > 0 || G.over) return false;
  p.hp -= dmg; p.inv = 0.75; G.stats.hurt += dmg; G.hitstop = 5;
  const dx = p.x - sx, dy = p.y - sy, d = Math.hypot(dx, dy) || 1;
  p.kx = (dx / d) * 7; p.ky = (dy / d) * 7;
  emit(G, 'playerHurt', p.x, p.y, dmg);
  const nova = p.stats.nova;
  if (nova > 0) {
    const n = 8 + 5 * nova;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      spawnBullet(G, { team: 0, x: p.x, y: p.y, vx: Math.cos(a) * 11, vy: Math.sin(a) * 11, dmg: p.stats.dmg * 0.9, life: 0.7, pierce: 1, burn: p.stats.burn });
    }
  }
  if (p.hp <= 0) { p.hp = 0; G.over = 'dead'; emit(G, 'death', p.x, p.y); }
  return true;
}

function processBlasts(G) {
  const p = G.player;
  for (let n = 0; n < G.blasts.length && n < 64; n++) {
    const bl = G.blasts[n];
    emit(G, 'explode', bl.x, bl.y, bl.r, bl.team);
    forNear(G, bl.x, bl.y, bl.r + 1.4, e => {
      if (e.dead || e.spawnT > 0) return;
      const dx = e.x - bl.x, dy = e.y - bl.y, d = Math.hypot(dx, dy);
      if (d > bl.r + e.r) return;
      if (bl.burn) { e.burnT = 3; e.burnDps = Math.max(e.burnDps, p.stats.dmg * 0.35 * Math.max(1, p.stats.burn)); }
      hurtEnemy(G, e, bl.dmg, { kx: (dx / (d || 1)) * 6, ky: (dy / (d || 1)) * 6 });
    });
    if (bl.team !== 0) {
      const d = Math.hypot(p.x - bl.x, p.y - bl.y);
      if (d < bl.r + p.r && lineClear(G.map, bl.x, bl.y, p.x, p.y)) hurtPlayer(G, 2, bl.x, bl.y);
    }
  }
  G.blasts.length = 0;
}

// ---- src/sim/enemies.js
// 敵の AI。経路は「プレイヤーからの距離場」を全員で共有し、見通しが通れば直接向かう。




const TMP = { x: 0, y: 0 };

function steer(e, tx, ty, speed, accel) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  const k = Math.min(1, accel * DT);
  if (d < 1e-4) { e.vx -= e.vx * k; e.vy -= e.vy * k; return; }
  e.vx += ((dx / d) * speed - e.vx) * k;
  e.vy += ((dy / d) * speed - e.vy) * k;
}

function viaFlow(G, e, speed, accel) {
  fieldStep(G.map, G.flow, e.x, e.y, 1, TMP);
  steer(e, TMP.x, TMP.y, speed, accel);
}

// 見通しがあれば包囲する角度へ、なければ距離場をたどる
function chase(G, e, p, d, speed) {
  if (!e.los) { viaFlow(G, e, speed, 9); return; }
  let tx = p.x, ty = p.y;
  if (d > 1.2 && d < 6.5) {
    const a = Math.atan2(e.y - p.y, e.x - p.x) + e.slot, k = Math.min(d - 1, 2.4);
    const sx = p.x + Math.cos(a) * k, sy = p.y + Math.sin(a) * k;
    if (!solidAt(G.map, sx, sy)) { tx = sx; ty = sy; }
  }
  steer(e, tx, ty, speed, 9);
}

function aimAt(G, e, p, d, bulletSpeed, lead) {
  const t = (d / bulletSpeed) * lead;
  return Math.atan2(p.y + p.vy * t - e.y, p.x + p.vx * t - e.x);
}

function ring(G, e, n, speed, offset) {
  for (let k = 0; k < n; k++) enemyBullet(G, e.x, e.y, offset + (k * TAU) / n, speed);
  emit(G, 'enemyShoot', e.x, e.y);
}

function aliveCount(G) {
  let c = 0;
  for (const o of G.enemies) if (!o.dead && !ENEMY[o.type].prop) c++;
  return c;
}

function summon(G, e, type, n) {
  for (let i = 0; i < n; i++) {
    for (let tries = 0; tries < 8; tries++) {
      const a = G.rng.range(0, TAU), r = G.rng.range(1.0, 2.2), x = e.x + Math.cos(a) * r, y = e.y + Math.sin(a) * r;
      if (solidAt(G.map, x, y) || !lineClear(G.map, e.x, e.y, x, y)) continue;
      spawnEnemy(G, type, x, y, { room: e.room, delay: 0.55 });
      break;
    }
  }
  emit(G, 'summon', e.x, e.y);
}

const AI = {
  // 近づくと短く飛びかかる
  mite(G, e, p, dx, dy, d) {
    if (e.state === 'lunge') { e.t -= DT; if (e.t <= 0) { e.state = 'idle'; e.cd = G.rng.range(1.2, 2.2); } return; }
    e.cd -= DT;
    chase(G, e, p, d, e.speed);
    if (e.los && d < 2.6 && e.cd <= 0) {
      e.state = 'lunge'; e.t = 0.24;
      const a = Math.atan2(dy + p.vy * 0.15, dx + p.vx * 0.15);
      e.vx = Math.cos(a) * 9.5; e.vy = Math.sin(a) * 9.5;
    }
  },

  spitter(G, e, p, dx, dy, d) {
    if (e.state === 'aim') {
      e.vx *= 0.8; e.vy *= 0.8; e.t -= DT;
      if (e.t <= 0) {
        const bs = Math.min(10, 6.6 + 0.35 * G.depth), a = aimAt(G, e, p, d, bs, 0.75);
        enemyBullet(G, e.x, e.y, a, bs);
        if (e.elite) { enemyBullet(G, e.x, e.y, a - 0.24, bs); enemyBullet(G, e.x, e.y, a + 0.24, bs); }
        emit(G, 'enemyShoot', e.x, e.y);
        e.state = 'idle'; e.cd = G.rng.range(1.1, 1.9);
      }
      return;
    }
    e.cd -= DT;
    if (!e.los) viaFlow(G, e, e.speed, 8);
    else if (d < 3.6) steer(e, e.x - dx, e.y - dy, e.speed * 1.15, 8);
    else if (d > 7.5) steer(e, p.x, p.y, e.speed, 8);
    else {
      const sx = e.x + (-dy / d) * e.side, sy = e.y + (dx / d) * e.side;
      if (solidAt(G.map, sx, sy) || e.blocked) e.side = -e.side;
      steer(e, sx, sy, e.speed * 0.8, 6);
    }
    if (e.los && d < 10 && e.cd <= 0 && G.tokens < G.maxTokens) {
      e.state = 'aim'; e.t = 0.4; G.tokens++;
      emit(G, 'telegraph', e.x, e.y, e.r);
    }
  },

  charger(G, e, p, dx, dy, d) {
    if (e.state === 'wind') {
      e.vx *= 0.7; e.vy *= 0.7; e.t -= DT;
      if (e.t <= 0) { e.state = 'dash'; e.t = 0.62; e.vx = Math.cos(e.ang) * 13.5; e.vy = Math.sin(e.ang) * 13.5; emit(G, 'charge', e.x, e.y); }
      return;
    }
    if (e.state === 'dash') {
      e.t -= DT;
      if (e.blocked) { e.state = 'idle'; e.stun = 1.0; e.cd = 1.6; e.vx = e.vy = 0; emit(G, 'thud', e.x, e.y, 0.5); }
      else if (e.t <= 0) { e.state = 'idle'; e.cd = 1.7; }
      return;
    }
    e.cd -= DT;
    chase(G, e, p, d, e.speed);
    if (e.los && d < 7.5 && d > 1.4 && e.cd <= 0) {
      e.state = 'wind'; e.t = 0.55;
      e.ang = Math.atan2(dy + p.vy * 0.22, dx + p.vx * 0.22);
      emit(G, 'telegraph', e.x, e.y, e.r);
    }
  },

  bomber(G, e, p, dx, dy, d) {
    if (e.state === 'fuse') {
      e.t -= DT; e.vx *= 0.86; e.vy *= 0.86;
      if (e.t <= 0) killEnemy(G, e);
      return;
    }
    if (e.los) steer(e, p.x, p.y, e.speed, 7); else viaFlow(G, e, e.speed, 9);
    if (d < 1.4 && e.los) { e.state = 'fuse'; e.t = 0.55; emit(G, 'fuse', e.x, e.y); }
  },

  // 闇の中では速く、灯りの中では遅い。ランタンの芯に近づくと焼ける。
  shade(G, e, p, dx, dy, d) {
    if ((G.tick + e.id) % 5 === 0) e.lit = lightAt(G, e.x, e.y);
    chase(G, e, p, d, e.speed * (e.lit < 0.3 ? 1.55 : 0.62));
    if (e.los && d < G.lanternR * 0.42 && (G.tick + e.id) % 15 === 0) hurtEnemy(G, e, 2.5, { src: 'burn' });
  },

  weaver(G, e, p, dx, dy, d) {
    e.cd -= DT;
    if (d < 6.5) { fieldStep(G.map, G.flow, e.x, e.y, -1, TMP); steer(e, TMP.x, TMP.y, e.speed, 8); }
    else if (d > 10.5 || !e.los) viaFlow(G, e, e.speed * 0.7, 6);
    else { e.vx *= 0.9; e.vy *= 0.9; }
    if (e.cd <= 0 && d < 15) {
      if (aliveCount(G) < 16) summon(G, e, 'mite', e.elite ? 3 : 2);
      e.cd = 5.5;
    }
  },

  sentinel(G, e, p, dx, dy, d) {
    e.cd -= DT; e.ang += DT * 0.5;
    if (e.cd <= 0 && d < 13 && (e.los || d < 4)) {
      ring(G, e, e.elite ? 16 : 11, 4.6, e.ang + (e.n & 1) * 0.35);
      e.n++; e.cd = 1.8;
    }
  },

  // ボス「灯らぬもの」。体力の 2/3 と 1/3 で部屋の松明を消す。松明が消えているほど硬い。
  unlit(G, e, p, dx, dy, d) {
    const room = G.map.rooms[e.room];
    const ph = e.hp < e.maxHp * 0.33 ? 3 : e.hp < e.maxHp * 0.66 ? 2 : 1;
    if (e.invuln > 0) e.invuln -= DT;
    if (ph > e.phase) {
      e.phase = ph; e.state = 'roar'; e.t = 1.4; e.invuln = 1.4; e.vx = e.vy = 0;
      for (const b of G.bullets) if (b.team !== 0) b.dead = true;
      for (const ti of room.torches) { G.map.torches[ti].lit = false; G.map.torches[ti].k = 0; }
      G.lightDirty = true;
      emit(G, 'bossPhase', e.x, e.y, ph);
      return;
    }
    const rest = () => { e.state = 'rest'; e.t = 1.35 - 0.25 * ph; };
    const next = () => {
      const list = ph === 1 ? ['burst', 'spiral', 'dash', 'ring'] : ['burst', 'summon', 'spiral', 'dash', 'ring'];
      const pat = list[e.pi++ % list.length];
      if (pat === 'burst') { e.state = 'burst'; e.n = 2 + ph; e.t = 0.4; }
      else if (pat === 'spiral') { e.state = 'spiral'; e.t = 2.6 + 0.4 * ph; }
      else if (pat === 'ring') { e.state = 'ring'; e.n = ph > 1 ? 3 : 2; e.t = 0.4; }
      else if (pat === 'summon') { e.state = 'summon'; e.t = 0.8; emit(G, 'telegraph', e.x, e.y, e.r); }
      else { e.state = 'wind'; e.n = ph; e.t = 0.65; e.ang = Math.atan2(dy, dx); emit(G, 'telegraph', e.x, e.y, e.r); }
    };
    e.t -= DT;
    switch (e.state) {
      case 'idle': e.state = 'intro'; e.t = 1.6; e.invuln = 1.6; break;
      case 'intro': case 'roar': e.vx *= 0.8; e.vy *= 0.8; if (e.t <= 0) next(); break;
      case 'rest': steer(e, p.x, p.y, e.speed * (0.8 + 0.2 * ph), 4); if (e.t <= 0) next(); break;
      case 'burst':
        steer(e, p.x, p.y, e.speed * 0.5, 4);
        if (e.t <= 0) {
          const n = 7 + 2 * ph, a0 = aimAt(G, e, p, d, 7, 0.5), spread = 1.15;
          for (let k = 0; k < n; k++) enemyBullet(G, e.x, e.y, a0 + (k / (n - 1) - 0.5) * spread, 7);
          emit(G, 'enemyShoot', e.x, e.y);
          e.n--; e.t = 0.58 - 0.06 * ph;
          if (e.n <= 0) rest();
        }
        break;
      case 'spiral':
        steer(e, room.cx + 0.5, room.cy + 0.5, e.speed, 4);
        if (G.tick % 5 === 0) {
          const arms = 2 + ph;
          e.ang += 0.21;
          for (let a = 0; a < arms; a++) enemyBullet(G, e.x, e.y, e.ang + (a * TAU) / arms, 4.5 + 0.3 * ph);
          if (G.tick % 20 === 0) emit(G, 'enemyShoot', e.x, e.y);
        }
        if (e.t <= 0) rest();
        break;
      case 'ring':
        e.vx *= 0.9; e.vy *= 0.9;
        if (e.t <= 0) {
          ring(G, e, 22 + 3 * ph, 4.8, (e.n & 1) * 0.16 + e.ang);
          e.n--; e.t = 0.8;
          if (e.n <= 0) rest();
        }
        break;
      case 'summon':
        e.vx *= 0.8; e.vy *= 0.8;
        if (e.t <= 0) {
          if (aliveCount(G) < 9) { summon(G, e, 'mite', 2); summon(G, e, 'shade', ph - 1); }
          rest();
        }
        break;
      case 'wind':
        e.vx *= 0.7; e.vy *= 0.7;
        if (e.t <= 0) { e.state = 'dash'; e.t = 0.9; e.vx = Math.cos(e.ang) * 15; e.vy = Math.sin(e.ang) * 15; emit(G, 'charge', e.x, e.y); }
        break;
      case 'dash':
        if (e.blocked || e.t <= 0) {
          if (e.blocked) { ring(G, e, 10 + 2 * ph, 4.6, e.ang); emit(G, 'thud', e.x, e.y, 1); }
          e.vx = e.vy = 0; e.n--;
          if (e.n > 0) { e.state = 'wind'; e.t = 0.5; e.ang = Math.atan2(dy, dx); emit(G, 'telegraph', e.x, e.y, e.r); }
          else rest();
        }
        break;
    }
  },
};

function updateEnemies(G) {
  const p = G.player, m = G.map, es = G.enemies;
  G.tokens = 0;
  for (const e of es) if (!e.dead && e.state === 'aim') G.tokens++;
  const count = es.length; // このティックで呼び出された敵は次のティックから動く
  for (let i = 0; i < count; i++) {
    const e = es[i];
    if (e.dead) continue;
    if (e.spawnT > 0) { e.spawnT -= DT; if (e.spawnT <= 0) emit(G, 'spawn', e.x, e.y, e.r); continue; }
    if (e.flash > 0) e.flash -= DT;
    if (e.burnT > 0) {
      e.burnT -= DT; e.burnTick -= DT;
      if (e.burnTick <= 0) { e.burnTick = 0.25; hurtEnemy(G, e, e.burnDps * 0.25, { src: 'burn' }); if (e.dead) continue; }
    }
    if (e.orbCd > 0) e.orbCd--;
    const def = ENEMY[e.type];
    if (def.prop) continue;
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1e-6;
    if ((G.tick + e.id) % 6 === 0) e.los = d < 16 && lineClear(m, e.x, e.y, p.x, p.y);
    if (e.stun > 0) { e.stun -= DT; e.vx *= 0.8; e.vy *= 0.8; }
    else AI[e.type](G, e, p, dx, dy, d);
    if (e.dead) continue;
    if (Math.abs(dx) > 0.2) e.face = dx > 0 ? 1 : -1;
    // 仲間どうしの押し合い
    let sx = 0, sy = 0;
    if (def.speed > 0 && !def.boss && e.state !== 'dash') {
      forNear(G, e.x, e.y, e.r + 0.7, o => {
        if (o === e || o.dead || o.spawnT > 0 || ENEMY[o.type].prop) return;
        const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy), min = e.r + o.r;
        if (od >= min) return;
        if (od < 1e-4) { sx += (e.id < o.id ? 1 : -1) * 0.02; return; }
        const k = ((min - od) / od) * 0.35;
        sx += ox * k; sy += oy * k;
      });
    }
    const ix = (e.vx + e.kx) * DT + sx, iy = (e.vy + e.ky) * DT + sy, ox = e.x, oy = e.y;
    e.kx *= 0.84; e.ky *= 0.84;
    if (def.speed > 0 || e.kx !== 0) {
      moveCircle(m, e, ix, iy);
      const want = Math.hypot(ix, iy);
      e.blocked = want > 0.05 && Math.hypot(e.x - ox, e.y - oy) < want * 0.45;
    }
    // 接触ダメージ
    if (e.type !== 'bomber' && e.type !== 'sentinel' && d < e.r + p.r) {
      hurtPlayer(G, e.type === 'charger' && e.state !== 'dash' ? 1 : e.dmg, e.x, e.y);
    }
  }
}

// ---- src/sim/game.js
// ゲーム本体のシミュレーション。DOM に触れず、入力の列から状態が一意に決まる。
// 1ティック = 1/60 秒。step(G, input) だけが状態を進める。







const SIM_VERSION = 1;
const BTN_FIRE = 1, BTN_DASH = 2, BTN_USE = 4;
const WIN_DEPTH = 5;

function createGame(seed) {
  const G = {
    seed: seed >>> 0, tick: 0, time: 0, depth: 0, rng: new RNG(mix32(seed >>> 0, 0xc0ffee)),
    map: null, enemies: [], bullets: [], pickups: [], blasts: [], events: [], chests: [], shrines: [],
    pending: null, over: null, won: false, hitstop: 0, nextId: 1, score: 0,
    stats: { kills: 0, dmg: 0, rooms: 0, hurt: 0 },
    flow: null, flowTile: -1, staticLight: null, seen: null, grid: null,
    lanternR: 9, lightDirty: true, lightVersion: 0, tokens: 0, maxTokens: 2, activeRoom: -1,
    darkT: 0, vacuum: 0, hpMul: 1, descend: false,
    player: {
      x: 0, y: 0, vx: 0, vy: 0, kx: 0, ky: 0, r: 0.3, hp: 6, up: {}, stats: computeStats({}), level: 1, xp: 0, xpNeed: 5,
      oil: 100, aim: 0, fireCd: 0, dashCd: 0, dashT: 0, dashDx: 1, dashDy: 0, dashId: 0, inv: 0,
      prevBtn: 0, shots: 0, orbA: 0, moving: false,
    },
  };
  enterDepth(G, 1);
  return G;
}

function enterDepth(G, depth) {
  const m = generateDungeon(G.seed, depth), p = G.player;
  G.depth = depth; G.map = m;
  rebuildSolid(m);
  G.hpMul = 1 + 0.2 * (depth - 1) + (depth > WIN_DEPTH ? 0.12 * (depth - WIN_DEPTH) : 0);
  G.maxTokens = 2 + (depth >> 1);
  G.enemies = []; G.bullets = []; G.pickups = []; G.blasts = []; G.chests = []; G.shrines = [];
  G.activeRoom = -1; G.flowTile = -1; G.darkT = 0; G.vacuum = 0;
  G.flow = new Uint16Array(m.w * m.h);
  G.staticLight = new Float32Array(m.w * m.h);
  G.seen = new Uint8Array(m.w * m.h);
  const cols = Math.ceil(m.w / 2), rows = Math.ceil(m.h / 2);
  G.grid = { cols, rows, head: new Int32Array(cols * rows).fill(-1), next: new Int32Array(256), count: 0 };
  p.x = m.start.x; p.y = m.start.y; p.vx = p.vy = p.kx = p.ky = 0; p.dashT = 0;
  for (const r of m.rooms) {
    if (r.role === 'start') r.state = 'cleared';
    for (const pr of r.props) spawnEnemy(G, 'urn', pr.x, pr.y, { room: r.id });
    if (r.role === 'treasure') G.chests.push({ x: r.cx + 0.5, y: r.cy + 0.5, room: r.id, open: false });
    if (r.role === 'shrine') G.shrines.push({ x: r.cx + 0.5, y: r.cy + 0.5, room: r.id, used: false });
  }
  rebuildStaticLight(G);
  G.lanternR = lanternTarget(G);
  markSeen(G);
  emit(G, 'descend', p.x, p.y, depth);
}

// ---------------------------------------------------------------- 部屋の戦闘
const SPAWN_WEIGHT = { mite: 5, spitter: 3, charger: 2.4, bomber: 2, shade: 2, weaver: 1, sentinel: 1.1 };

function buildWaves(G, room) {
  const rng = G.rng, depth = G.depth;
  const area = Math.min(1.3, Math.max(0.75, (room.w * room.h) / 110));
  let budget = (9 + depth * 4.6 + room.dist * 1.1) * area * (room.role === 'exit' ? 1.3 : 1);
  if (depth > WIN_DEPTH) budget *= 1 + 0.1 * (depth - WIN_DEPTH);
  const nWaves = depth >= 5 ? 4 : depth >= 2 ? 3 : 2;
  const types = Object.keys(SPAWN_WEIGHT).filter(t => ENEMY[t].minDepth <= depth);
  const waves = [];
  for (let w = 0; w < nWaves; w++) {
    let b = (budget / nWaves) * (0.85 + 0.3 * w), guard = 0;
    const wave = [], cap = { weaver: 1, sentinel: 2 };
    while (b >= 1 && wave.length < 16 && guard++ < 60) {
      const ok = types.filter(t => ENEMY[t].cost <= b && (cap[t] === undefined || cap[t] > 0));
      if (!ok.length) break;
      const t = ok[rng.weighted(ok.map(k => SPAWN_WEIGHT[k]))];
      const elite = b >= ENEMY[t].cost * 3 && rng.chance(Math.min(0.2, 0.035 * depth));
      wave.push({ type: t, elite });
      b -= ENEMY[t].cost * (elite ? 3 : 1);
      if (cap[t] !== undefined) cap[t]--;
    }
    waves.push(wave);
  }
  return waves;
}

function spawnWave(G, room) {
  const m = G.map, p = G.player, rng = G.rng, wave = room.waves[room.wave++];
  for (const w of wave) {
    let x = room.cx + 0.5, y = room.cy + 0.5;
    for (let tries = 0; tries < 40; tries++) {
      const tx = rng.irange(room.x, room.x + room.w - 1), ty = rng.irange(room.y, room.y + room.h - 1);
      if (m.tiles[ty * m.w + tx] !== T_FLOOR || m.solid[ty * m.w + tx]) continue;
      if (Math.hypot(tx + 0.5 - p.x, ty + 0.5 - p.y) < (tries < 30 ? 4.5 : 2.5)) continue;
      x = tx + 0.5; y = ty + 0.5; break;
    }
    spawnEnemy(G, w.type, x, y, { room: room.id, elite: w.elite, delay: rng.range(0.7, 1.2) });
  }
  emit(G, 'wave', room.cx + 0.5, room.cy + 0.5, room.wave);
}

function setDoors(G, room, barred) {
  const m = G.map;
  for (const d of room.doors) m.barred[d.y * m.w + d.x] = barred ? 1 : 0;
  rebuildSolid(m);
  G.flowTile = -1; G.lightDirty = true;
}

function lightRoom(G, room) {
  for (const ti of room.torches) G.map.torches[ti].lit = true;
  G.lightDirty = true;
}

function startEncounter(G, room) {
  room.state = 'active'; G.activeRoom = room.id;
  setDoors(G, room, true);
  emit(G, 'roomStart', room.cx + 0.5, room.cy + 0.5, room.role === 'boss' ? 1 : 0);
  if (room.role === 'boss') {
    lightRoom(G, room);
    room.waves = []; room.wave = 0;
    spawnEnemy(G, 'unlit', room.cx + 0.5, room.cy + 0.5, { room: room.id, delay: 1.2 });
  } else {
    room.waves = buildWaves(G, room); room.wave = 0;
    spawnWave(G, room);
  }
}

function updateRooms(G) {
  const m = G.map, p = G.player;
  const tx = p.x | 0, ty = p.y | 0, rid = m.roomAt[ty * m.w + tx];
  if (rid >= 0 && G.activeRoom < 0) {
    const r = m.rooms[rid];
    if (r.state === 'idle' && p.x > r.x + 0.9 && p.x < r.x + r.w - 0.9 && p.y > r.y + 0.9 && p.y < r.y + r.h - 0.9) {
      if (r.role === 'combat' || r.role === 'exit' || r.role === 'boss') startEncounter(G, r);
      else { r.state = 'cleared'; lightRoom(G, r); emit(G, 'calm', p.x, p.y); }
    }
  }
  if (G.activeRoom >= 0) {
    const r = m.rooms[G.activeRoom];
    let alive = 0;
    for (const e of G.enemies) if (!e.dead && e.room === r.id && !ENEMY[e.type].prop) alive++;
    if (alive <= (r.wave < r.waves.length ? 1 : 0)) {
      if (r.wave < r.waves.length) spawnWave(G, r);
      else {
        r.state = 'cleared'; G.activeRoom = -1;
        setDoors(G, r, false); lightRoom(G, r);
        p.oil = Math.min(p.stats.oilMax, p.oil + 22);
        G.vacuum = 100; G.stats.rooms++; G.score += r.role === 'boss' ? 1000 : 100;
        emit(G, 'roomClear', r.cx + 0.5, r.cy + 0.5);
        if (m.stairs.room === r.id) { m.stairs.open = true; emit(G, 'stairs', m.stairs.x, m.stairs.y); }
        if (r.role === 'boss' && G.depth === WIN_DEPTH && !G.won) { G.won = true; emit(G, 'win', p.x, p.y); }
      }
    }
  }
}

// ---------------------------------------------------------------- 強化
function rollChoices(G, relic) {
  const p = G.player, pool = [], weights = [];
  for (const u of UPGRADES) {
    if ((p.up[u.id] | 0) >= u.max) continue;
    if (u.req && !p.up[u.req]) continue;
    if (relic ? u.rarity < 2 : u.rarity > 2) continue;
    pool.push(u.id);
    weights.push(relic ? (u.rarity === 3 ? 5 : 3) : u.rarity === 1 ? 10 : 4.5);
  }
  const out = [];
  while (out.length < 3 && pool.length) {
    const i = G.rng.weighted(weights);
    out.push(pool[i]); pool.splice(i, 1); weights.splice(i, 1);
  }
  return out;
}

function offer(G, relic) {
  const choices = rollChoices(G, relic), p = G.player;
  if (!choices.length) { p.hp = Math.min(p.stats.maxHp, p.hp + 2); return; }
  G.pending = { kind: relic ? 'relic' : 'level', choices };
}

function takeUpgrade(G, id) {
  const p = G.player;
  p.up[id] = (p.up[id] | 0) + 1;
  const oldMax = p.stats.maxHp, oldOil = p.stats.oilMax;
  p.stats = computeStats(p.up);
  if (p.stats.maxHp > oldMax) p.hp += p.stats.maxHp - oldMax;
  if (p.stats.oilMax > oldOil) p.oil += p.stats.oilMax - oldOil;
  emit(G, 'upgrade', p.x, p.y, id);
}

function gainXp(G, v) {
  G.player.xp += v; G.score += v;
}

// ---------------------------------------------------------------- プレイヤー
function firePlayer(G) {
  const p = G.player, s = p.stats, rng = G.rng;
  p.shots++;
  const big = s.overcharge > 0 && p.shots % 5 === 0;
  const n = s.count, spread = n > 1 ? Math.min(0.9, 0.16 * (n - 1)) : 0;
  for (let i = 0; i < n; i++) {
    const a = p.aim + (n > 1 ? (i / (n - 1) - 0.5) * spread : 0) + rng.range(-0.025, 0.025);
    const sp = s.projSpeed * (big ? 1.15 : 1);
    spawnBullet(G, {
      team: 0, x: p.x + Math.cos(a) * 0.2, y: p.y + Math.sin(a) * 0.2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r: big ? 0.26 : 0.14, dmg: s.dmg * (big ? 1.5 + s.overcharge : 1), life: 1.15,
      pierce: s.pierce + (big ? 3 : 0), bounce: s.bounce, split: s.split, chain: s.chain, burn: s.burn,
      homing: s.homing, explode: s.explode, crit: rng.chance(s.crit), big,
    });
  }
  emit(G, 'shoot', p.x, p.y, p.aim, big ? 1 : 0);
}

function updatePlayer(G, inp) {
  const p = G.player, s = p.stats, m = G.map;
  p.aim = (inp.aim / 32768) * Math.PI;
  let mx = inp.mx / 127, my = inp.my / 127;
  const ml = Math.hypot(mx, my);
  if (ml > 1) { mx /= ml; my /= ml; }
  const pressed = inp.btn & ~p.prevBtn;
  p.prevBtn = inp.btn;
  if (p.inv > 0) p.inv -= DT;
  if (p.dashCd > 0) p.dashCd -= DT;
  if (p.fireCd > 0) p.fireCd -= DT;

  if ((pressed & BTN_DASH) && p.dashCd <= 0 && p.dashT <= 0) {
    let ddx = mx, ddy = my;
    if (ml < 0.2) { ddx = Math.cos(p.aim); ddy = Math.sin(p.aim); }
    const l = Math.hypot(ddx, ddy) || 1;
    p.dashDx = ddx / l; p.dashDy = ddy / l; p.dashT = 0.17; p.dashCd = s.dashCd; p.dashId++;
    p.inv = Math.max(p.inv, 0.27);
    emit(G, 'dash', p.x, p.y, Math.atan2(p.dashDy, p.dashDx));
  }
  if (p.dashT > 0) {
    p.dashT -= DT; p.vx = p.dashDx * 17; p.vy = p.dashDy * 17;
    if (s.dashHit > 0) {
      forNear(G, p.x, p.y, 1.6, e => {
        if (e.dead || e.spawnT > 0 || e.dashTick === p.dashId) return;
        if (Math.hypot(e.x - p.x, e.y - p.y) > e.r + 0.75) return;
        e.dashTick = p.dashId;
        e.burnT = 3; e.burnDps = Math.max(e.burnDps, s.dmg * 0.35 * Math.max(1, s.burn));
        hurtEnemy(G, e, s.dmg * 1.3 * s.dashHit, { kx: p.dashDx * 5, ky: p.dashDy * 5 });
      });
    }
  } else {
    const k = Math.min(1, 16 * DT);
    p.vx += (mx * s.move - p.vx) * k; p.vy += (my * s.move - p.vy) * k;
  }
  moveCircle(m, p, (p.vx + p.kx) * DT, (p.vy + p.ky) * DT);
  p.kx *= 0.8; p.ky *= 0.8;
  p.moving = ml > 0.1;

  if ((inp.btn & BTN_FIRE) && p.fireCd <= 0 && p.dashT <= 0) { firePlayer(G); p.fireCd = 1 / s.rate; }

  // 油とランタン
  p.oil = Math.max(0, p.oil - s.oilDrain * DT);
  G.lanternR += (lanternTarget(G) - G.lanternR) * 0.08;
  if (p.oil <= 0) {
    G.darkT += DT;
    if (G.darkT > 6) {
      G.darkT = 0;
      let shades = 0;
      for (const e of G.enemies) if (!e.dead && e.type === 'shade' && e.room === -1) shades++;
      for (let tries = 0; tries < 24 && shades < 3; tries++) {
        const a = G.rng.range(0, TAU), r = G.rng.range(6, 10), x = p.x + Math.cos(a) * r, y = p.y + Math.sin(a) * r;
        if (solidAt(m, x, y) || G.flow[(y | 0) * m.w + (x | 0)] === 65535) continue;
        spawnEnemy(G, 'shade', x, y, { delay: 0.8 });
        emit(G, 'darkHunt', x, y);
        break;
      }
    }
  } else G.darkT = 0;

  // 蛍
  if (s.orbitals > 0) {
    p.orbA += DT * 3.3;
    for (let i = 0; i < s.orbitals; i++) {
      const a = p.orbA + (i * TAU) / s.orbitals, ox = p.x + Math.cos(a) * 1.35, oy = p.y + Math.sin(a) * 1.35;
      forNear(G, ox, oy, 1.6, e => {
        if (e.dead || e.spawnT > 0 || e.orbCd > 0 || Math.hypot(e.x - ox, e.y - oy) > e.r + 0.32) return;
        e.orbCd = 18;
        hurtEnemy(G, e, s.dmg * 0.6, { kx: Math.cos(a) * 2, ky: Math.sin(a) * 2 });
      });
    }
  }

  // 近くの松明に火を移す
  for (const t of m.torches) {
    if (t.lit) continue;
    if (Math.abs(t.x - p.x) < 1.4 && Math.abs(t.y - p.y) < 1.4 && Math.hypot(t.x - p.x, t.y - p.y) < 1.4) {
      t.k += DT;
      if (t.k >= 0.45) { t.lit = true; G.lightDirty = true; emit(G, 'torch', t.x, t.y); }
    } else t.k = 0;
  }

  for (const c of G.chests) {
    if (!c.open && Math.hypot(c.x - p.x, c.y - p.y) < 1.0) {
      c.open = true; offer(G, true);
      emit(G, 'chest', c.x, c.y);
    }
  }
  for (const sh of G.shrines) {
    if (!sh.used && Math.hypot(sh.x - p.x, sh.y - p.y) < 1.1) {
      sh.used = true; p.oil = s.oilMax; p.hp = Math.min(s.maxHp, p.hp + 2);
      emit(G, 'shrine', sh.x, sh.y);
    }
  }
  const st = m.stairs;
  if ((pressed & BTN_USE) && st.open && Math.hypot(st.x - p.x, st.y - p.y) < 1.3) G.descend = true;
}

// ---------------------------------------------------------------- 弾
function chainFrom(G, from, jumps, dmg, visited) {
  let cur = from;
  for (let j = 0; j < jumps; j++) {
    let best = null, bd = 3.6;
    forNear(G, cur.x, cur.y, 3.6, o => {
      if (o.dead || o.spawnT > 0 || visited.includes(o.id)) return;
      const d = Math.hypot(o.x - cur.x, o.y - cur.y);
      if (d < bd) { bd = d; best = o; }
    });
    if (!best) break;
    emit(G, 'chain', cur.x, cur.y, best.x, best.y);
    visited.push(best.id);
    hurtEnemy(G, best, dmg, {});
    cur = best;
  }
}

function endBullet(G, b) {
  b.dead = true;
  if (b.team === 0 && b.explode > 0) G.blasts.push({ x: b.x, y: b.y, r: 0.9 + 0.3 * b.explode, dmg: b.dmg * 0.6, team: 0 });
  emit(G, 'spark', b.x, b.y, b.team);
}

function updateBullets(G) {
  const m = G.map, p = G.player, bs = G.bullets, s = p.stats;
  const count = bs.length;
  for (let i = 0; i < count; i++) {
    const b = bs[i];
    if (b.dead) continue;
    b.life -= DT; b.age++;
    if (b.life <= 0) { endBullet(G, b); continue; }
    if (b.team === 0 && b.homing > 0 && b.age % 3 === 0) {
      let best = null, bd = 5.5;
      forNear(G, b.x, b.y, 5.5, e => {
        if (e.dead || e.spawnT > 0 || ENEMY[e.type].prop || (b.hit && b.hit.includes(e.id))) return;
        const d = Math.hypot(e.x - b.x, e.y - b.y);
        if (d < bd && (e.x - b.x) * b.vx + (e.y - b.y) * b.vy > 0) { bd = d; best = e; }
      });
      if (best) {
        const sp = Math.hypot(b.vx, b.vy), cur = Math.atan2(b.vy, b.vx);
        let diff = Math.atan2(best.y - b.y, best.x - b.x) - cur;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        const turn = 0.11 * b.homing, a = cur + Math.max(-turn, Math.min(turn, diff));
        b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
      }
    }
    const px = b.x, py = b.y;
    b.x += b.vx * DT; b.y += b.vy * DT;
    if (solidAt(m, b.x, b.y)) {
      if (b.bounce > 0) {
        const hx = solidAt(m, b.x, py), hy = solidAt(m, px, b.y);
        if (hx || !hy) b.vx = -b.vx;
        if (hy || !hx) b.vy = -b.vy;
        b.x = px; b.y = py; b.bounce--;
        emit(G, 'bounce', px, py);
      } else { endBullet(G, b); continue; }
    }
    if (b.team === 0) {
      forNear(G, b.x, b.y, b.r + 1.5, e => {
        if (b.dead || e.dead || e.spawnT > 0) return;
        const dx = e.x - b.x, dy = e.y - b.y;
        if (dx * dx + dy * dy > (b.r + e.r) * (b.r + e.r)) return;
        if (b.hit && b.hit.includes(e.id)) return;
        const dmg = b.dmg * (b.crit ? 2 : 1), sp = Math.hypot(b.vx, b.vy) || 1;
        if (b.burn > 0) { e.burnT = 3; e.burnDps = Math.max(e.burnDps, s.dmg * 0.35 * b.burn); }
        hurtEnemy(G, e, dmg, { kx: (b.vx / sp) * 2.6, ky: (b.vy / sp) * 2.6, crit: b.crit });
        (b.hit || (b.hit = [])).push(e.id);
        if (b.chain > 0) chainFrom(G, e, b.chain, dmg * 0.5, [e.id]);
        if (b.split > 0) {
          const a0 = Math.atan2(b.vy, b.vx);
          for (let k = 0; k < 2; k++) {
            const a = a0 + (k ? 0.5 : -0.5);
            spawnBullet(G, {
              team: 0, x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 0.11, dmg: b.dmg * 0.45,
              life: 0.4, split: b.split - 1, burn: b.burn, bounce: b.bounce > 0 ? 1 : 0, hit: [e.id],
            });
          }
        }
        if (b.pierce > 0) b.pierce--; else endBullet(G, b);
      });
    } else if (p.inv <= 0) {
      const dx = p.x - b.x, dy = p.y - b.y, rr = b.r + p.r * 0.8;
      if (dx * dx + dy * dy < rr * rr) { hurtPlayer(G, b.dmg, b.x - b.vx, b.y - b.vy); b.dead = true; }
    }
  }
}

function updatePickups(G) {
  const p = G.player, s = p.stats, m = G.map;
  for (const k of G.pickups) {
    k.age++;
    const dx = p.x - k.x, dy = p.y - k.y, d = Math.hypot(dx, dy) || 1e-6;
    const wanted = k.kind !== 'heart' || p.hp < s.maxHp;
    const pull = wanted && k.age > 18 && (d < s.magnet || G.vacuum > 0);
    if (pull) {
      const sp = Math.min(16, 5 + k.age * 0.25);
      k.vx += ((dx / d) * sp - k.vx) * 0.25; k.vy += ((dy / d) * sp - k.vy) * 0.25;
      k.x += k.vx * DT; k.y += k.vy * DT;
    } else {
      k.vx *= 0.9; k.vy *= 0.9;
      const nx = k.x + k.vx * DT, ny = k.y + k.vy * DT;
      if (!solidAt(m, nx, k.y)) k.x = nx; else k.vx = -k.vx * 0.5;
      if (!solidAt(m, k.x, ny)) k.y = ny; else k.vy = -k.vy * 0.5;
    }
    if (wanted && k.age > 18 && d < 0.6) {
      k.dead = true;
      if (k.kind === 'xp') gainXp(G, k.v);
      else if (k.kind === 'oil') p.oil = Math.min(s.oilMax, p.oil + k.v);
      else p.hp = Math.min(s.maxHp, p.hp + k.v);
      emit(G, 'pickup', k.x, k.y, k.kind);
    }
  }
}

// プレイヤーから光線を飛ばし、見えたタイルを地図に記す
function markSeen(G) {
  const m = G.map, p = G.player, R = Math.min(12, G.lanternR + 1.5), seen = G.seen;
  for (let i = 0; i < 80; i++) {
    const a = (i / 80) * TAU, dx = Math.cos(a) * 0.5, dy = Math.sin(a) * 0.5;
    let x = p.x, y = p.y;
    for (let s = 0; s < R * 2; s++) {
      const tx = x | 0, ty = y | 0;
      if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h) break;
      seen[ty * m.w + tx] = 1;
      if (m.solid[ty * m.w + tx]) break;
      x += dx; y += dy;
    }
  }
}

function compact(arr) {
  let n = 0;
  for (let i = 0; i < arr.length; i++) if (!arr[i].dead) arr[n++] = arr[i];
  arr.length = n;
}

// ---------------------------------------------------------------- 1ティック
// input: { mx, my: -127..127, aim: -32768..32767（角度）, btn: ビット, choice: 0..3 }
function step(G, inp) {
  G.events.length = 0;
  if (G.over) return;
  G.tick++;
  const p = G.player;
  if (G.pending) {
    const c = inp.choice | 0;
    if (c >= 1 && c <= G.pending.choices.length) { takeUpgrade(G, G.pending.choices[c - 1]); G.pending = null; }
    p.prevBtn = inp.btn;
    return;
  }
  if (G.hitstop > 0) { G.hitstop--; return; }
  G.time += DT;
  if (G.vacuum > 0) G.vacuum--;

  buildGrid(G);
  updatePlayer(G, inp);
  const pt = (p.y | 0) * G.map.w + (p.x | 0);
  if (pt !== G.flowTile) { G.flowTile = pt; distanceField(G.map, p.x | 0, p.y | 0, G.flow); }
  updateEnemies(G);
  updateBullets(G);
  processBlasts(G);
  updatePickups(G);
  compact(G.enemies); compact(G.bullets); compact(G.pickups);
  updateRooms(G);
  if (G.lightDirty) rebuildStaticLight(G);
  if (G.tick % 6 === 0) markSeen(G);

  if (!G.over && !G.pending && p.xp >= p.xpNeed) {
    p.xp -= p.xpNeed; p.level++; p.xpNeed = Math.round(p.xpNeed * 1.2 + 3);
    emit(G, 'levelUp', p.x, p.y, p.level);
    offer(G, false);
  }
  if (G.descend && !G.over) {
    G.descend = false;
    G.score += 500;
    p.oil = Math.min(p.stats.oilMax, p.oil + 35);
    enterDepth(G, G.depth + 1);
  }
}

// 再生の一致を確かめるための状態ハッシュ
function hashState(G) {
  const f = new Float32Array(1), u = new Uint32Array(f.buffer);
  let h = mix32(G.tick, G.depth);
  const add = v => { f[0] = v; h = mix32(h, u[0]); };
  const p = G.player;
  add(p.x); add(p.y); add(p.hp); add(p.oil); add(p.xp); add(G.score);
  for (const e of G.enemies) { add(e.x); add(e.y); add(e.hp); }
  for (const b of G.bullets) { add(b.x); add(b.y); }
  h = mix32(h, G.enemies.length * 65536 + G.bullets.length);
  for (const s of G.rng.state()) h = mix32(h, s >>> 0);
  return h >>> 0;
}

// ---- src/sim/bot.js
// 自動プレイ bot。バランス調整の試行と、タイトル画面のデモに使う。
// 16方向＋停止の候補それぞれについて少し先の自分と弾・敵の位置を予測し、いちばん安全で目的に近い向きを選ぶ。




const KEEP = { mite: 3.2, charger: 4.6, bomber: 4.2, shade: 3.4, spitter: 2.2, weaver: 2, sentinel: 2.4, unlit: 5.5 };
const PRIORITY = {
  twin: 10, storm: 10, sunheart: 10, kindling: 8, wick: 8, chain: 8, splinter: 7, pierce: 6, ignite: 6, orbit: 6,
  vigor: 6, keen: 5, overcharge: 5, afterglow: 5, homing: 5, volatile: 5, vamp: 6, everoil: 6, nova: 3, radiance: 4,
  reservoir: 4, fleet: 4, phase: 3, ricochet: 3, magnet: 2,
};
const BOT_TMP = { x: 0, y: 0 };

function createBot(seed = 1, skill = 1) {
  return { rng: new RNG(seed), skill, field: null, target: -1, version: -1, dir: 0, useTick: 0, mx: 0, my: 0 };
}

function botInput(bot, G) {
  const inp = { mx: 0, my: 0, aim: 0, btn: 0, choice: 0 };
  const p = G.player, m = G.map, s = p.stats;
  if (G.pending) {
    let best = 0, bv = -1;
    G.pending.choices.forEach((id, i) => {
      let v = (PRIORITY[id] || 3) + bot.rng.f() * 3 * (2 - bot.skill);
      if (id === 'vigor' && p.hp <= 3) v += 5;
      if (v > bv) { bv = v; best = i; }
    });
    inp.choice = best + 1;
    return inp;
  }

  // --- 狙う相手
  let tgt = null, tv = Infinity, hostile = 0;
  const threats = [];
  for (const e of G.enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    const prop = ENEMY[e.type].prop;
    if (!prop && d < 14) { threats.push(e); hostile++; }
    if (e.spawnT > 0.25 || d > 13 || (prop && d > 6)) continue;
    if (!lineClear(m, p.x, p.y, e.x, e.y)) continue;
    const v = d + (prop ? 20 : 0) - (e.type === 'bomber' ? 3 : 0) - (e.type === 'weaver' ? 2 : 0);
    if (v < tv) { tv = v; tgt = e; }
  }
  if (tgt) {
    const d = Math.hypot(tgt.x - p.x, tgt.y - p.y), t = (d / s.projSpeed) * bot.skill;
    const a = Math.atan2(tgt.y + tgt.vy * t - p.y, tgt.x + tgt.vx * t - p.x) + bot.rng.range(-0.1, 0.1) * (1 - bot.skill);
    inp.aim = Math.max(-32768, Math.min(32767, Math.round((a / Math.PI) * 32768)));
    inp.btn |= 1;
  } else inp.aim = Math.round((Math.atan2(p.vy, p.vx || 1e-3) / Math.PI) * 32767);

  // --- 目的地
  const combat = hostile > 0 && (G.activeRoom >= 0 || tgt);
  let gx = p.x, gy = p.y, hasGoal = false;
  if (!combat) {
    let pk = null, pd = 9;
    for (const k of G.pickups) {
      if (k.kind === 'heart' && p.hp >= s.maxHp) continue;
      const d = Math.hypot(k.x - p.x, k.y - p.y);
      if (d < pd && lineClear(m, p.x, p.y, k.x, k.y)) { pd = d; pk = k; }
    }
    if (pk) { gx = pk.x; gy = pk.y; hasGoal = true; }
    else {
      let target = -1, bd = 65535;
      for (const r of m.rooms) {
        if (r.state !== 'idle') continue;
        const d = G.flow[r.cy * m.w + r.cx];
        if (d < bd) { bd = d; target = r.cy * m.w + r.cx; }
      }
      if (target < 0 && m.stairs.open) target = (m.stairs.y | 0) * m.w + (m.stairs.x | 0);
      if (target >= 0) {
        if (bot.target !== target || bot.version !== m.version || bot.map !== m) {
          bot.field = distanceField(m, target % m.w, (target / m.w) | 0, bot.field && bot.map === m ? bot.field : null);
          bot.target = target; bot.version = m.version; bot.map = m;
        }
        // 経路を数歩先まで見て、見通せるいちばん遠い点を目指す
        fieldStep(m, bot.field, p.x, p.y, 1, BOT_TMP);
        gx = BOT_TMP.x; gy = BOT_TMP.y; hasGoal = true;
        for (let i = 0; i < 4; i++) {
          if (!fieldStep(m, bot.field, BOT_TMP.x, BOT_TMP.y, 1, BOT_TMP) || !lineClear(m, p.x, p.y, BOT_TMP.x, BOT_TMP.y)) break;
          gx = BOT_TMP.x; gy = BOT_TMP.y;
        }
        if (m.stairs.open && target === (m.stairs.y | 0) * m.w + (m.stairs.x | 0) && Math.hypot(m.stairs.x - p.x, m.stairs.y - p.y) < 1.1) {
          if (G.tick % 4 < 2) inp.btn |= 4;
        }
      }
    }
  }
  let torch = null;
  if (combat) {
    let td = 99;
    const room = G.activeRoom >= 0 ? m.rooms[G.activeRoom] : null;
    if (room && room.role === 'boss') for (const ti of room.torches) {
      const t = m.torches[ti];
      if (t.lit) continue;
      const d = Math.hypot(t.x - p.x, t.y - p.y);
      if (d < td) { td = d; torch = t; }
    }
  }

  // --- 向きの候補を採点（3ティックに1回）
  // 腕前が低いほど判断が遅く、弾に気づく距離も短い
  const period = Math.round(3 + (1 - bot.skill) * 14), notice = 1.5 + 4.5 * bot.skill;
  if (G.tick % period === 0) {
    const room = G.activeRoom >= 0 ? m.rooms[G.activeRoom] : null;
    let bestCost = Infinity, bestDir = -1, bestMin = 9;
    for (let k = -1; k < 16; k++) {
      const a = (k / 16) * TAU, ux = k < 0 ? 0 : Math.cos(a), uy = k < 0 ? 0 : Math.sin(a);
      let cost = k === bot.dir ? -0.15 : 0, minB = 9;
      const ex = p.x + ux * s.move * 0.4, ey = p.y + uy * s.move * 0.4;
      if (k >= 0 && (solidAt(m, p.x + ux * 0.55, p.y + uy * 0.55) || !lineClear(m, p.x, p.y, ex, ey))) cost += 30;
      for (const b of G.bullets) {
        if (b.team === 0 || b.dead) continue;
        if (Math.abs(b.x - p.x) > notice || Math.abs(b.y - p.y) > notice) continue;
        for (let t = 0.08; t < 0.6; t += 0.1) {
          const dd = Math.hypot(b.x + b.vx * t - (p.x + ux * s.move * t), b.y + b.vy * t - (p.y + uy * s.move * t));
          if (dd < minB) minB = dd;
          if (dd < 0.85) cost += 60 * (0.85 - dd) * (0.7 - t) + 12;
        }
      }
      for (const e of threats) {
        if (e.spawnT > 0.35) { if (Math.hypot(e.x - ex, e.y - ey) < 1.5) cost += 3; continue; }
        const keep = KEEP[e.type] || 3;
        if (e.state === 'wind' || e.state === 'dash') {
          // 突進の線から外れる
          const rx = ex - e.x, ry = ey - e.y, cx = Math.cos(e.ang), cy = Math.sin(e.ang);
          const along = rx * cx + ry * cy, side = Math.abs(rx * cy - ry * cx);
          if (along > -0.5 && along < 11 && side < 1.6 + e.r) cost += (1.6 + e.r - side) * 14;
        }
        const dd = Math.hypot(e.x + e.vx * 0.3 - ex, e.y + e.vy * 0.3 - ey);
        if (dd < keep) cost += (keep - dd) * (e.type === 'bomber' && e.state === 'fuse' ? 14 : 6);
      }
      if (combat) {
        if (tgt) cost += Math.abs(Math.hypot(tgt.x - ex, tgt.y - ey) - 5.5) * 0.9;
        if (room) cost += Math.hypot(room.cx + 0.5 - ex, room.cy + 0.5 - ey) * 0.12;
        if (torch) cost += Math.hypot(torch.x - ex, torch.y - ey) * 0.9;
      } else if (hasGoal) cost += Math.hypot(gx - ex, gy - ey) * 2.2;
      if (cost < bestCost) { bestCost = cost; bestDir = k; bestMin = minB; }
    }
    bot.dir = bestDir;
    bot.mx = bestDir < 0 ? 0 : Math.round(Math.cos((bestDir / 16) * TAU) * 127);
    bot.my = bestDir < 0 ? 0 : Math.round(Math.sin((bestDir / 16) * TAU) * 127);
    bot.dashNow = bot.skill > 0.5 && p.dashCd <= 0 && bestDir >= 0 && (bestMin < 0.55 || bestCost > 26);
  }
  inp.mx = bot.mx; inp.my = bot.my;
  if (bot.dashNow && G.tick % 2 === 0) { inp.btn |= 2; bot.dashNow = false; }
  return inp;
}

// ---- src/core/replay.js
// リプレイの保存形式。シミュレーションは決定的なので、種と入力の列だけで1プレイを丸ごと再現できる。
// 入力1ティック = 6バイト（移動x, 移動y, 照準の下位・上位, ボタン, 選択）
function packInputs(list) {
  const b = new Uint8Array(list.length * 6);
  list.forEach((inp, i) => {
    const o = i * 6, aim = inp.aim & 0xffff;
    b[o] = inp.mx & 255; b[o + 1] = inp.my & 255; b[o + 2] = aim & 255; b[o + 3] = aim >> 8; b[o + 4] = inp.btn; b[o + 5] = inp.choice;
  });
  let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function unpackInputs(str) {
  const s = atob(str), out = [];
  for (let o = 0; o + 5 < s.length; o += 6) {
    const aim = s.charCodeAt(o + 2) | (s.charCodeAt(o + 3) << 8);
    out.push({
      mx: (s.charCodeAt(o) << 24) >> 24, my: (s.charCodeAt(o + 1) << 24) >> 24, aim: (aim << 16) >> 16,
      btn: s.charCodeAt(o + 4), choice: s.charCodeAt(o + 5),
    });
  }
  return out;
}

// ---- src/render/atlas.js
// 画像素材は1枚も持たない。スプライトもタイルも、起動時にこのコードが1ピクセルずつ描く。


const ATLAS_SIZE = 256;

function hex(c) { return [(c >> 16) & 255, (c >> 8) & 255, c & 255]; }

class Spr {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Uint8Array(w * h * 4); }

  function update(dt, G) {
    st.time += dt;
    st.shake = Math.max(0, st.shake - dt * 2.4); st.hurt = Math.max(0, st.hurt - dt * 2.2);
    st.white = Math.max(0, st.white - dt * 1.6); st.fade = Math.max(0, st.fade - dt * 1.4); st.digitT -= dt; st.digitN = Math.min(6, st.digitN + dt * 18);

    }
    for (const e of G.enemies) {
      if (e.burnT > 0 && Math.random() < dt * 14) part(e.x + rnd(-e.r, e.r), e.y + rnd(-e.r, e.r), 0, rnd(-3, -1.2), 0.4, 0.22, FIRE, { drag: 1 });

  function resize() {

  }

  function screenToWorld(cx, cy) {

    return { x: st.tlx + ((cx - r.left) / r.width) * TILES_X, y: st.tly + ((cy - r.top) / r.height) * TILES_Y };
  }

  function drawFan(poly, x, y, R, r, g, b, a) {

  function flush(batch) {

  function render(G, opt = {}) {
    resize();
    const m = G.map, p = G.player, t = st.time, theme = THEMES[(G.depth - 1) % THEMES.length];
    if (st.map !== m || st.version !== m.version) {
      st.map = m; st.version = m.version; st.segs = buildSegments(m); st.torchPoly.clear();
    }

    // --- タイル

    const y0 = Math.max(0, Math.floor(camY) - 1), y1 = Math.min(m.h - 1, Math.floor(camY + TILES_Y) + 2);

      if (tc.lit) { const f = 1 + Math.sin(t * 13 + tc.x * 5) * 0.12; spr(glow, S.glow, bx, by - 0.2, 1.5 * f, 1.5 * f, 1, 0.55, 0.2, 0.7); }
      else if (tc.k > 0) spr(glow, S.ring, tc.x, tc.y, 1.2, 1.2, 1, 0.7, 0.3, tc.k * 2);
    }

        continue;
      }
      if (it.e) {
        const e = it.e, def = ENEMY[e.type], base = e.type === 'unlit' ? 2.5 : 1, sc = (e.r / def.r) * base;

        const wob = e.state === 'wind' ? Math.sin(t * 60) * 0.04 : 0;
        spr(lit, S[e.type + frame], e.x + wob, e.y - 0.12 * sc, sc * e.face, sc, cr, cg, cb, alpha, 0, e.type === 'unlit' ? 0.25 : e.type === 'sentinel' ? 0.2 : 0.06, 0, flash);
        if (e.state === 'wind') {
          const len = def.boss ? 15 : 8, w = def.boss ? 0.5 : 0.22, a = 0.35 + 0.35 * Math.sin(t * 40);
          spr(glow, S.white, e.x + Math.cos(e.ang) * len / 2, e.y + Math.sin(e.ang) * len / 2, len, w, 1, 0.15, 0.2, a, e.ang);
        }
        if (e.state === 'aim') spr(glow, S.glow, e.x, e.y, 1.6, 1.6, 1, 0.2, 0.3, 0.8);
        if (e.elite) spr(glow, S.glow, e.x, e.y, e.r * 4.4, e.r * 4.4, 1, 0.75, 0.2, 0.22);

      if (!tc.lit || tc.x < camX - 7 || tc.x > camX + TILES_X + 7 || tc.y < camY - 7 || tc.y > camY + TILES_Y + 7) continue;
      let poly = st.torchPoly.get(i);
      if (!poly) { poly = visPolygon(st.segs, tc.x, tc.y, TORCH_RADIUS + 1); st.torchPoly.set(i, poly); }
      const f = 0.86 + Math.sin(t * 9 + i * 2.1) * 0.06 + Math.sin(t * 23 + i) * 0.04;
      drawFan(poly, tc.x, tc.y, TORCH_RADIUS + 1, 0.8 * f, 0.4 * f, 0.16 * f, 0);
    }
    for (const f of flashes) {
      const k = f.t / f.ttl;
      if (f.shadow) drawFan(visPolygon(st.segs, f.x, f.y, f.R), f.x, f.y, f.R, f.r * k, f.g * k, f.b * k, 0);
      else pointLight(f.x, f.y, f.R, f.r * k * 0.7, f.g * k * 0.7, f.b * k * 0.7);
    }
    gl.useProgram(P.point.p);
    gl.uniform2f(P.point.u.uCam, camX, camY); gl.uniform2f(P.point.u.uTarget, SW, SH_);
    gl.bindVertexArray(plVAO); gl.bindBuffer(gl.ARRAY_BUFFER, plBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, pl.d.subarray(0, pl.n * 6));
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, pl.n);
    gl.disable(gl.BLEND);
    // 影の縁をぼかす
    gl.useProgram(P.blur.p); gl.uniform1i(P.blur.u.uTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, lightB.fbo); gl.bindTexture(gl.TEXTURE_2D, lightA.tex[0]); gl.uniform2f(P.blur.u.uDir, 1.2 / LW, 0); quad();
    gl.bindFramebuffer(gl.FRAMEBUFFER, lightA.fbo); gl.bindTexture(gl.TEXTURE_2D, lightB.tex[0]); gl.uniform2f(P.blur.u.uDir, 0, 1.2 / LH); quad();

    // === パス3: ブルーム
    const oilK = p.oil / p.stats.oilMax;
    const bindComposite = (pr, pxScale) => {
      gl.useProgram(pr.p);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneT.tex[0]); gl.uniform1i(pr.u.uScene, 0);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sceneT.tex[1]); gl.uniform1i(pr.u.uEmis, 1);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, lightA.tex[0]); gl.uniform1i(pr.u.uLightTex, 2);
      gl.uniform2f(pr.u.uFrac, fx, fy); gl.uniform2f(pr.u.uSceneSize, SW, SH_); gl.uniform2f(pr.u.uView, VIEW_W, VIEW_H);
      gl.uniform3f(pr.u.uAmbient, 0.035, 0.04, 0.075); gl.uniform1f(pr.u.uPx, pxScale);
    };
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloom[0].fbo); gl.viewport(0, 0, bloom[0].w, bloom[0].h);
    bindComposite(P.bright, 1); quad();
    gl.activeTexture(gl.TEXTURE0);
    gl.useProgram(P.down.p); gl.uniform1i(P.down.u.uTex, 0);
    for (let i = 1; i < bloom.length; i++) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, bloom[i].fbo); gl.viewport(0, 0, bloom[i].w, bloom[i].h);
      gl.bindTexture(gl.TEXTURE_2D, bloom[i - 1].tex[0]); gl.uniform2f(P.down.u.uTexel, 1 / bloom[i - 1].w, 1 / bloom[i - 1].h); quad();
    }
    gl.useProgram(P.up.p); gl.uniform1i(P.up.u.uTex, 0);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    for (let i = bloom.length - 1; i > 0; i--) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, bloom[i - 1].fbo); gl.viewport(0, 0, bloom[i - 1].w, bloom[i - 1].h);
      gl.bindTexture(gl.TEXTURE_2D, bloom[i].tex[0]); gl.uniform2f(P.up.u.uTexel, 0.5 / bloom[i].w, 0.5 / bloom[i].h); quad();
    }
    gl.disable(gl.BLEND);

    // === パス4: 画面へ
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height);
    bindComposite(P.final, canvas.width / VIEW_W);
    const u = P.final.u;
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, bloom[0].tex[0]); gl.uniform1i(u.uBloom, 3);
    const low = p.hp <= 2 && !G.over ? 0.25 + 0.2 * Math.sin(t * 6) : 0;
    gl.uniform3f(u.uTint, 1, 1, 1); gl.uniform1f(u.uTime, t % 100); gl.uniform1f(u.uBloomK, 0.36);
    gl.uniform1f(u.uVig, 0.55 + (1 - oilK) * 0.3); gl.uniform1f(u.uDesat, (G.over ? 0.8 : 0) + Math.max(0, 0.25 - oilK) * 1.2);
    gl.uniform1f(u.uCA, 0.004 + st.hurt * 0.02 + st.shake * 0.006);
    if (st.white > 0) gl.uniform4f(u.uFlash, 1, 1, 1, st.white * 0.5);
    else gl.uniform4f(u.uFlash, 1, 0.1, 0.15, Math.max(st.hurt * 0.55, low * 0.4));
    gl.uniform1f(u.uFade, (1 - st.fade) * (opt.dim ?? 1));
    quad();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindVertexArray(null);
  }

  return {
    render, update, handleEvents, screenToWorld, resize,
    setMouseWorld(x, y) { st.mouseX = x; st.mouseY = y; },
    reset() { parts.length = 0; flashes.length = 0; st.camInit = false; st.shake = 0; st.hurt = 0; st.white = 0; st.fade = 1; },
    stats: () => ({ sprites: lit.n + glow.n, particles: parts.length, lights: pl.n, hdr }),
  };
}

    depth: -1, score: '', time: '', auto: null, replay: null,

  // ---------------------------------------------------------------- HUD 更新
  function ensureHearts(n) {
    if (heartSlots.length === n) return;
    hearts.textContent = '';
    heartSlots.length = 0;
    for (let i = 0; i < n; i++) {
      const slot = el('span', 'ui-heart empty');
      add(slot, makeHeartSvg('ui-heart-empty'), makeHeartSvg('ui-heart-fill'));
      hearts.appendChild(slot);
      heartSlots.push(slot);
    }
  }

  function upgradeSignature(up) {
    if (!up) return '';
    const parts = [];
    for (const u of UPGRADES) {
      const n = up[u.id] | 0;
      if (n > 0) parts.push(`${u.id}:${n}`);
    }
    return parts.join('|');
  }

  function rebuildChips(up) {
    chips.textContent = '';
    for (const u of UPGRADES) {
      const n = up ? (up[u.id] | 0) : 0;
      if (n <= 0) continue;
      const chip = el('span', `ui-chip ui-rarity-${u.rarity}`, `${u.name} ×${n}`);
      chips.appendChild(chip);
    }
  }

  function showHUD(visible) {
    hud.classList.toggle('ui-is-off', !visible);
    hud.setAttribute('aria-hidden', visible ? 'false' : 'true');
  }

  function updateHUD(G, extra) {
    if (!G || !G.player) return;
    const p = G.player;
    const stats = p.stats || {};
    const maxHp = Math.max(0, Math.round(Number(stats.maxHp) || 0));
    const hp = Math.max(0, Math.min(maxHp, Math.round(Number(p.hp) || 0)));
    const maxChanged = maxHp !== cache.maxHp;
    if (maxChanged) {
      cache.maxHp = maxHp;
      ensureHearts(Math.ceil(maxHp / 2));
    }
    const heartCount = Math.ceil(maxHp / 2);
    const hpShown = Math.max(0, Math.min(maxHp, hp));
    for (let i = 0; i < heartCount; i++) {
      const left = hpShown - i * 2;
      const state = left >= 2 ? 'full' : left === 1 ? 'half' : 'empty';
      const slot = heartSlots[i];
      if (slot && !slot.classList.contains(state)) {
        slot.classList.remove('full', 'half', 'empty');
        slot.classList.add(state);
      }
    }
    if (hp !== cache.hp || maxChanged) {
      cache.hp = hp;
      hearts.setAttribute('aria-label', `体力 ${hp} / ${maxHp}`);
    }

    const oilMax = Math.max(1, Number(stats.oilMax) || 1);
    const oilRatio = Math.max(0, Math.min(1, (Number(p.oil) || 0) / oilMax));
    const oilPct = Math.round(oilRatio * 100);
    const oilDanger = oilRatio < 0.2;
    if (oilPct !== cache.oilPct) {
      cache.oilPct = oilPct;
      oilFill.style.width = `${oilPct}%`;
      oilPctLabel.textContent = `${oilPct}%`;
    }
    if (oilDanger !== cache.oilDanger) {
      cache.oilDanger = oilDanger;
      oil.classList.toggle('is-danger', oilDanger);
    }

    const level = Math.max(1, p.level | 0 || 1);
    const xpNeed = Math.max(1, Number(p.xpNeed) || 1);
    const xpPct = Math.max(0, Math.min(100, Math.round((Number(p.xp) || 0) / xpNeed * 100)));
    if (xpPct !== cache.xpPct) {
      cache.xpPct = xpPct;
      xpFill.style.width = `${xpPct}%`;
    }
    if (level !== cache.level) {
      cache.level = level;
      xpLv.textContent = `Lv ${level}`;
    }

    const depth = G.depth | 0;
    if (depth !== cache.depth) {
      cache.depth = depth;
      depthEl.textContent = `第${depth}層`;
    }
    const score = String(Math.max(0, Math.floor(Number(G.score) || 0))).padStart(6, '0');
    if (score !== cache.score) {
      cache.score = score;
      scoreEl.textContent = score;
    }
    const time = fmtTime(G.time);
    if (time !== cache.time) {
      cache.time = time;
      timeEl.textContent = time;
    }

    const isAuto = !!(extra && extra.auto);
    const isReplay = !!(extra && extra.replay);
    if (isAuto !== cache.auto) {
      cache.auto = isAuto;
      autoTag.hidden = !isAuto;
    }
    if (isReplay !== cache.replay) {
      cache.replay = isReplay;
      replayTag.hidden = !isReplay;
    }

    let bossEnemy = null;
    if (Array.isArray(G.enemies)) {
      for (const e of G.enemies) {
        if (!e.dead && e.type === 'unlit') { bossEnemy = e; break; }
      }
    }
    const bossOn = !!bossEnemy;
    if (bossOn !== cache.bossOn) {
      cache.bossOn = bossOn;
      boss.classList.toggle('show', bossOn);
    }
    if (bossEnemy) {
      const bossMax = Math.max(1, Number(bossEnemy.maxHp) || 1);
      const frac = Math.max(0, Math.min(1, (Number(bossEnemy.hp) || 0) / bossMax));
      const pct = Math.round(frac * 1000) / 10;
      if (pct !== cache.bossPct) {
        cache.bossPct = pct;
        bossFill.style.width = `${pct}%`;
      }
    }

    const dashMax = Math.max(0.0001, Number(stats.dashCd) || 0.9);
    const remain = Math.max(0, Number(p.dashCd) || 0);
    const ready = remain <= 0.0001;
    const dashPct = ready ? 100 : Math.max(0, Math.min(100, Math.round((1 - remain / dashMax) * 100)));
    if (ready !== cache.dashReady) {
      cache.dashReady = ready;
      dash.classList.toggle('ready', ready);
    }
    if (dashPct !== cache.dashPct) {
      cache.dashPct = dashPct;
      dashRing.style.setProperty('--ui-dash-angle', `${Math.round(dashPct * 3.6)}deg`);
    }

    const up = p.up || {};
    const sig = upgradeSignature(up);
    if (sig !== cache.chipSig) {
      cache.chipSig = sig;
      rebuildChips(up);
    }
  }

  // ---------------------------------------------------------------- ミニマップ
  function drawMinimap(G) {
    if (!miniCtx) return;
    const W = 168;
    const H = 120;
    miniCtx.fillStyle = 'rgba(7, 6, 13, 0.78)';
    miniCtx.fillRect(0, 0, W, H);
    if (!G || !G.map || !G.seen) return;
    const m = G.map;
    const seen = G.seen;
    const tiles = m.tiles;
    if (!tiles || !m.w || !m.h) return;

    for (let ty = 0; ty < m.h; ty++) {
      for (let tx = 0; tx < m.w; tx++) {
        const i = ty * m.w + tx;
        if (!seen[i]) continue;
        const t = tiles[i];
        if (t === 2) {
          miniCtx.fillStyle = '#5b5273';
          miniCtx.fillRect(tx * 2, ty * 2, 2, 2);
        } else if (t === 1 || t === 3) {
          miniCtx.fillStyle = '#3a3350';
          miniCtx.fillRect(tx * 2, ty * 2, 2, 2);
        }
      }
    }

    if (Array.isArray(m.rooms)) {
      for (const room of m.rooms) {
        if (!room) continue;
        const tint = room.state === 'cleared' ? '#6b5a3a' : room.state === 'active' ? '#7a2f3a' : null;
        if (!tint) continue;
        miniCtx.fillStyle = tint;
        const x0 = Math.max(0, room.x | 0);
        const y0 = Math.max(0, room.y | 0);
        const x1 = Math.min(m.w, (room.x | 0) + (room.w | 0));
        const y1 = Math.min(m.h, (room.y | 0) + (room.h | 0));
        for (let ty = y0; ty < y1; ty++) {
          for (let tx = x0; tx < x1; tx++) {
            const i = ty * m.w + tx;
            if (!seen[i] || tiles[i] !== 1) continue;
            miniCtx.fillRect(tx * 2, ty * 2, 2, 2);
          }
        }
      }
    }

    const now = typeof performance !== 'undefined' ? performance.now() : Date.now();
    if (m.stairs && m.stairs.open) {
      // 明滅は色の濃淡で表し、点そのものは常に描く
      miniCtx.fillStyle = Math.floor(now / 420) % 2 === 0 ? '#6fa8ff' : '#35507a';
      miniCtx.fillRect((m.stairs.x | 0) * 2, (m.stairs.y | 0) * 2, 3, 3);
    }

    if (Array.isArray(m.rooms)) {
      for (const room of m.rooms) {
        if (!room || room.state !== 'idle') continue;
        if (room.role !== 'treasure' && room.role !== 'shrine') continue;
        const ci = (room.cy | 0) * m.w + (room.cx | 0);
        if (!seen[ci]) continue;
        miniCtx.fillStyle = '#c59bff';
        miniCtx.fillRect((room.cx | 0) * 2, (room.cy | 0) * 2, 3, 3);
      }
    }

    const px = Math.max(0, Math.min(m.w - 1, G.player ? G.player.x | 0 : 0));
    const py = Math.max(0, Math.min(m.h - 1, G.player ? G.player.y | 0 : 0));
    miniCtx.fillStyle = '#ffe9b0';
    miniCtx.fillRect(px * 2, py * 2, 3, 3);
  }

  // ---------------------------------------------------------------- タイトル
  function parseSeed() {
    const raw = seedInput.value.trim();
    if (!raw) return null;
    if (/^-?\d+$/.test(raw)) return Number(raw) >>> 0;
    return hashSeed(raw);
  }

  function openTitle(info) {
    hideAllMenus();
    const data = info || {};
    const best = data.best || null;
    if (best && Number.isFinite(Number(best.score)) && Number.isFinite(Number(best.depth))) {
      bestLine.textContent = `最高記録 ${Number(best.score)}点 / 第${Number(best.depth)}層`;
      bestLine.hidden = false;
    } else {
      bestLine.textContent = '';
      bestLine.hidden = true;
    }
    replayBtn.hidden = !data.hasReplay;
    const opts = data.options || {};
    for (const key of ['master', 'music', 'sfx']) {
      const value = opts[key];
      if (value === undefined || value === null) continue;
      const v = clamp01(value);
      sliderInputs[key].value = String(v);
      sliderOutputs[key].textContent = `${Math.round(v * 100)}%`;
    }
    if (opts.shake !== undefined) shakeInput.checked = !!opts.shake;
    const version = data.version ? String(data.version) : '';
    versionEl.textContent = version ? `ver. ${version}` : '';
    versionEl.hidden = !version;
    titleOpen = true;
    setOpen(titleOverlay, true);
  }

  function hideTitle() {
    titleOpen = false;
    setOpen(titleOverlay, false);
  }

  // ---------------------------------------------------------------- 強化
  function selectUpgrade(index) {
    if (!upgradeOpen || upgradeLocked) return;
    if (index < 0 || index >= upgradeCards.length) return;
    upgradeLocked = true;
    const card = upgradeCards[index];
    if (card) {
      card.classList.add('is-picked');
      for (const other of upgradeCards) other.disabled = true;
    }
    call('pick', index + 1);
  }

  function openUpgrade(pending, G) {
    if (!pending || !Array.isArray(pending.choices)) return;
    const up = G && G.player && G.player.up ? G.player.up : {};
    const key = `${pending.kind || 'level'}|${pending.choices.join(',')}|${upgradeSignature(up)}`;
    // 毎フレーム呼ばれてもカードを作り直さない
    if (upgradeOpen && key === upgradeKey) return;
    hideAllMenus();
    upgradeKey = key;
    upgradeLocked = false;
    upgradeOpenedAt = typeof performance !== 'undefined' ? performance.now() : Date.now();
    upgradeHeading.textContent = pending.kind === 'relic'
      ? '遺物を見つけた'
      : '残り火が満ちた — ひとつ選べ';
    upgradeCardsWrap.textContent = '';
    upgradeCards = [];
    pending.choices.forEach((id, idx) => {
      const def = UPGRADE_BY_ID[id] || { id, name: String(id), desc: '', max: 1, rarity: 1 };
      const current = up[id] | 0;
      const max = Math.max(1, def.max | 0 || 1);
      const card = el('button', `ui-card ui-rarity-${def.rarity | 0 || 1}`);
      card.type = 'button';
      card.style.setProperty('--ui-card-i', String(idx));
      const top = el('div', 'ui-card-top');
      const key = el('span', 'ui-card-key', String(idx + 1));
      const name = el('span', 'ui-card-name', def.name);
      add(top, name, key);
      const desc = el('div', 'ui-card-desc', def.desc || '');
      const pipRow = el('div', 'ui-card-pips');
      for (let i = 0; i < max; i++) {
        let state = '';
        if (i < current) state = ' on';
        else if (i === current) state = ' next';
        pipRow.appendChild(el('span', `ui-pip${state}`, ''));
      }
      const levelText = el('div', 'ui-card-level', `${current} → ${Math.min(max, current + 1)}`);
      card.appendChild(top);
      card.appendChild(desc);
      card.appendChild(pipRow);
      card.appendChild(levelText);
      card.addEventListener('click', () => selectUpgrade(idx));
      upgradeCardsWrap.appendChild(card);
      upgradeCards.push(card);
    });
    upgradeOpen = true;
    setOpen(upgradeOverlay, true);
  }

  function hideUpgrade() {
    upgradeOpen = false;
    upgradeLocked = false;
    upgradeKey = '';
    setOpen(upgradeOverlay, false);
  }

  // ---------------------------------------------------------------- ポーズ
  function copyPauseSeed() {
    const text = pauseSeed.textContent || '';
    const finish = ok => {
      copyBtn.textContent = ok ? 'コピー済み' : 'コピー失敗';
      if (copyTimer) clearTimeout(copyTimer);
      copyTimer = setTimeout(() => { copyBtn.textContent = 'コピー'; }, 1500);
    };
    try {
      if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => finish(true), () => finish(false));
      } else {
        finish(false);
      }
    } catch (err) {
      finish(false);
    }
  }

  function pauseOwnedList(G) {
    ownedList.textContent = '';
    const up = G && G.player && G.player.up ? G.player.up : {};
    let any = false;
    for (const u of UPGRADES) {
      const n = up[u.id] | 0;
      if (n <= 0) continue;
      any = true;
      ownedList.appendChild(el('span', `ui-owned-chip ui-rarity-${u.rarity}`, `${u.name} ×${n}`));
    }
    if (!any) ownedList.appendChild(el('span', 'ui-owned-empty', 'まだ強化はない'));
  }

  function openPause(G) {
    hideAllMenus();
    const seed = G && G.seed !== undefined && G.seed !== null ? G.seed >>> 0 : 0;
    pauseSeed.textContent = String(seed);
    copyBtn.textContent = 'コピー';
    pauseOwnedList(G);
    pauseOpen = true;
    setOpen(pauseOverlay, true);
  }

  function hidePause() {
    pauseOpen = false;
    setOpen(pauseOverlay, false);
  }

  // ---------------------------------------------------------------- リザルト
  function addEndStat(label, value) {
    endStats.appendChild(el('div', 'ui-end-stat-label', label));
    endStats.appendChild(el('div', 'ui-end-stat-value', String(value)));
  }

  function openEnd(result) {
    hideAllMenus();
    const r = result || {};
    const won = !!r.won;
    endHeading.textContent = won ? '闇は払われた' : '灯りは消えた';
    endHeading.classList.toggle('is-won', won);
    endBadge.hidden = !r.newBest;
    endStats.textContent = '';
    addEndStat('スコア', Math.max(0, Math.floor(Number(r.score) || 0)));
    addEndStat('到達', `第${Math.max(0, r.depth | 0)}層`);
    addEndStat('時間', fmtTime(r.time));
    addEndStat('討伐', Math.max(0, r.kills | 0));
    addEndStat('レベル', Math.max(1, r.level | 0 || 1));
    endUpgrades.textContent = '';
    const upgrades = Array.isArray(r.upgrades) ? r.upgrades : [];
    if (!upgrades.length) {
      endUpgrades.appendChild(el('span', 'ui-owned-empty', '強化なし'));
    } else {
      for (const u of upgrades) {
        if (!u) continue;
        const def = u.id ? UPGRADE_BY_ID[u.id] : null;
        const rarity = def ? def.rarity : 1;
        const name = u.name || (def && def.name) || String(u.id || '');
        const count = Math.max(1, u.count | 0 || 1);
        endUpgrades.appendChild(el('span', `ui-owned-chip ui-rarity-${rarity}`, `${name} ×${count}`));
      }
    }
    const seed = r.seed !== undefined && r.seed !== null ? r.seed >>> 0 : 0;
    endSeed.textContent = String(seed);
    continueBtn.hidden = !won;
    endOpen = true;
    setOpen(endOverlay, true);
  }

  function hideEnd() {
    endOpen = false;
    setOpen(endOverlay, false);
  }

  // ---------------------------------------------------------------- トースト / バナー
  function toast(text, kind) {
    const valid = kind === 'good' || kind === 'warn' || kind === 'boss' ? kind : 'info';
    while (toastBox.childElementCount >= 3) toastBox.firstElementChild.remove();
    const node = el('div', `ui-toast ui-toast-${valid}`, String(text));
    toastBox.appendChild(node);
    setTimeout(() => {
      if (node.parentNode) node.parentNode.removeChild(node);
    }, 2300);
  }

  function banner(title, subtitleText) {
    bannerTitle.textContent = String(title || '');
    bannerSub.textContent = String(subtitleText || '');
    bannerToken++;
    const token = bannerToken;
    bannerEl.classList.remove('show');
    // アニメーションを確実にやり直す
    void bannerEl.offsetWidth;
    bannerEl.classList.add('show');
    setTimeout(() => {
      if (token === bannerToken) bannerEl.classList.remove('show');
    }, 2700);
  }

  function isMenuOpen() {
    return titleOpen || upgradeOpen || pauseOpen || endOpen;
  }

  // ---------------------------------------------------------------- 入力
  function onKeyDown(ev) {
    if (!ev || ev.defaultPrevented || ev.isComposing) return;
    if (upgradeOpen) {
      const now = typeof performance !== 'undefined' ? performance.now() : Date.now();
      if (now - upgradeOpenedAt < 350 || ev.repeat) return;
      let index = 0;
      if (ev.key === '1' || ev.code === 'Numpad1') index = 1;
      else if (ev.key === '2' || ev.code === 'Numpad2') index = 2;
      else if (ev.key === '3' || ev.code === 'Numpad3') index = 3;
      if (index > 0) {
        ev.preventDefault();
        selectUpgrade(index - 1);
      }
      return;
    }
    if (titleOpen && (ev.key === 'Enter' || ev.code === 'NumpadEnter') && !ev.repeat) {
      ev.preventDefault();
      if (document.activeElement === seedInput) {
        call('start', { seed: parseSeed(), auto: false });
      } else {
        call('start', { seed: null, auto: false });
      }
    }
  }

  startBtn.addEventListener('click', () => call('start', { seed: null, auto: false }));
  demoBtn.addEventListener('click', () => call('start', { seed: null, auto: true }));
  replayBtn.addEventListener('click', () => call('replay'));
  resumeBtn.addEventListener('click', () => call('resume'));
  restartBtn.addEventListener('click', () => call('restart'));
  titleBtn.addEventListener('click', () => call('toTitle'));
  copyBtn.addEventListener('click', copyPauseSeed);
  againBtn.addEventListener('click', () => call('restart'));
  endTitleBtn.addEventListener('click', () => call('toTitle'));
  continueBtn.addEventListener('click', () => call('resume'));
  window.addEventListener('keydown', onKeyDown);

  return {
    showTitle: openTitle,
    hideTitle,
    showHUD,
    updateHUD,
    drawMinimap,
    showUpgrade: openUpgrade,
    hideUpgrade,
    showPause: openPause,
    hidePause,
    showEnd: openEnd,
    hideEnd,
    toast,
    banner,
    isMenuOpen,
  };
}

// 'D5' 'Bb4' 'C#6' → MIDI 番号。'-' は休符。
function au_midi(name) {
  if (name === '-') return -1;
  const m = /^([A-G])([#b]?)(\d)$/.exec(name);
  if (!m) throw new Error('bad note ' + name);
  return au_NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) + 1) * 12;
}
